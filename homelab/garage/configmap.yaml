apiVersion: v1
kind: ConfigMap
metadata:
  name: garage-config
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "14"
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    rpc_bind_addr = "[::]:3901"
    bootstrap_peers = []

    replication_factor = 1

    [s3_api]
    api_bind_addr = "[::]:3900"
    s3_region = "garage"
    root_domain = ".s3.k8s.hu.ls"

    [s3_web]
    bind_addr = "[::]:3902"
    root_domain = ".web.k8s.hu.ls"

    [admin]
    api_bind_addr = "[::]:3903"
