apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s-hu-ls
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretName: wildcard-k8s-hu-ls-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.k8s.hu.ls"
    - "k8s.hu.ls"
---
# S3 API: external access for rclone, AWS CLI, mc, etc.
# In-cluster consumers skip this and use garage-s3.garage.svc.cluster.local directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-s3
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - s3.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: s3.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage-s3
                port:
                  number: 3900
---
# Admin UI: cluster layout, bucket browser, key management.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: garage-admin
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "15"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - garage.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: garage.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: garage-admin
                port:
                  number: 3903
