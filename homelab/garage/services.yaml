# S3 API: stable in-cluster DNS for JuiceFS CSI and CNPG barman.
# Points directly at Garage host processes on both nodes.
# In-cluster consumers use: http://garage-s3.garage.svc.cluster.local:3900
apiVersion: v1
kind: Service
metadata:
  name: garage-s3
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  clusterIP: None
  ports:
    - name: s3-api
      port: 3900
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: garage-s3
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "14"
subsets:
  - addresses:
      - ip: 192.168.1.228  # home VM
      - ip: 192.168.1.230  # NUC
    ports:
      - name: s3-api
        port: 3900
        protocol: TCP
---
# Admin API: for garage CLI operations from inside the cluster if needed.
# http://garage-admin.garage.svc.cluster.local:3903
apiVersion: v1
kind: Service
metadata:
  name: garage-admin
  namespace: garage
  labels:
    app.kubernetes.io/name: garage-admin
  annotations:
    argocd.argoproj.io/sync-wave: "14"
spec:
  clusterIP: None
  ports:
    - name: admin
      port: 3903
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: garage-admin
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-wave: "14"
subsets:
  - addresses:
      - ip: 192.168.1.228  # home VM
      - ip: 192.168.1.230  # NUC
    ports:
      - name: admin
        port: 3903
        protocol: TCP
