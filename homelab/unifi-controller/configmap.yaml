apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-init
  namespace: unifi
data:
  init-mongo.js: |
    db.getSiblingDB("unifi").createUser({
      user: "unifi",
      pwd: process.env.MONGO_INITDB_ROOT_PASSWORD,
      roles: [
        { role: "dbOwner", db: "unifi" }
      ]
    });
    
    db.getSiblingDB("unifi_stat").createUser({
      user: "unifi",
      pwd: process.env.MONGO_INITDB_ROOT_PASSWORD,
      roles: [
        { role: "dbOwner", db: "unifi_stat" }
      ]
    });
