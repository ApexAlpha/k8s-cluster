apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi-mongodb
  namespace: unifi
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app: unifi-mongodb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi-mongodb
  template:
    metadata:
      labels:
        app: unifi-mongodb
    spec:
      # Pin to k3s-home node (same as UniFi controller)
      nodeSelector:
        kubernetes.io/hostname: k3s-home
      
      containers:
      - name: mongodb
        image: mongo:4.4  # UniFi requires MongoDB 4.4
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "unifi"
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: unifi-secrets
              key: mongo-password
        - name: MONGO_INITDB_DATABASE
          value: "unifi"
        ports:
        - name: mongodb
          containerPort: 27017
          protocol: TCP
        volumeMounts:
        - name: mongodb-data
          mountPath: /data/db
        - name: mongodb-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: mongodb-data
        persistentVolumeClaim:
          claimName: unifi-mongodb-data
      - name: mongodb-init
        configMap:
          name: mongodb-init
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-mongodb-data
  namespace: unifi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
