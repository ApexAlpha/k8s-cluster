apiVersion: apps/v1
kind: Deployment
metadata:
  name: byparr
  namespace: byparr
  labels:
    app: byparr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: byparr
  template:
    metadata:
      labels:
        app: byparr
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-nuc
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: byparr
          image: ghcr.io/thephaseless/byparr:latest@sha256:5e41fe2278f187bfafc762fee822c0678deb49e229171c89a116e56820ca7278
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8191
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8191"
            - name: TZ
              value: "Europe/Amsterdam"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
