apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "14"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.13.0
    helm:
      values: |
        # Two copies on distinct nodes for newly created v1 volumes.
        # Existing volumes keep their current replica count.
        persistence:
          defaultClassReplicaCount: 2
        defaultSettings:
          defaultReplicaCount:
            v1: "2"
            v2: "3"
          replicaSoftAntiAffinity: false
        # GitOps: skip Longhorn pre-upgrade checker hook (references an SA not yet created); disables it.
        preUpgradeChecker:
          jobEnabled: false
          upgradeVersionCheck: false
        # Longhorn UI replicas spread across nodes (anti-affinity is built-in).
        longhornUI:
          replicas: 2
        # Expose the UI through Traefik + Authentik forwardAuth using the
        # existing wildcard cert (already present in every namespace).
        ingress:
          enabled: true
          host: longhorn.k8s.hu.ls
          tls: true
          tlsSecret: wildcard-k8s-hu-ls-tls
          annotations:
            traefik.ingress.kubernetes.io.router.middlewares: authentik-authentik@kubernetescrd
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
