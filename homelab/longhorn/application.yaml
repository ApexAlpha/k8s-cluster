apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "14"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: v1.12.1
    helm:
      values: |
        # One replicated volume per app -> protect against a single node loss.
        defaultClassReplicaCount: 2
        # Longhorn UI replicas spread across nodes (anti-affinity is built-in).
        longhornUI:
          replicas: 2
        # Expose the UI through Traefik + Authentik forwardAuth using the
        # existing wildcard cert (already present in every namespace).
        ingress:
          enabled: true
          host: longhorn.k8s.hu.ls
          tls: true
          tlsSecret: wildcard-k8s-hu-ls-tls
          annotations:
            traefik.ingress.kubernetes.io.router.middlewares: authentik-authentik@kubernetescrd
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
