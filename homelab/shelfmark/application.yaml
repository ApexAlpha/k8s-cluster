apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shelfmark
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ApexAlpha/k8s-cluster.git
    path: homelab/shelfmark
    targetRevision: HEAD
  destination:
    namespace: shelfmark
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true