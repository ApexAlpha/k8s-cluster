apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data-local
  namespace: hermes
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
