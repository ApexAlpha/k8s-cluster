apiVersion: v1
kind: Endpoints
metadata:
  name: hermes
  namespace: hermes
  annotations:
    argocd.argoproj.io/sync-wave: "2"
subsets:
  - addresses:
      - ip: 192.168.1.235   # Hermes agent host (LXC), runs dashboard (9119) + api server (8642)
    ports:
      - name: api
        port: 8642
        protocol: TCP
      - name: dashboard
        port: 9119
        protocol: TCP
