apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s-hu-ls
  namespace: it-tools
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  secretName: wildcard-k8s-hu-ls-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.k8s.hu.ls"
    - "k8s.hu.ls"
