apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.7
    helm:
      values: |
        deployment:
          replicas: 2
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: traefik
                topologyKey: kubernetes.io/hostname
        service:
          type: ClusterIP
          annotations:
            netbird.io/expose: "true"
            netbird.io/groups: "k8s-ingress"
        ingressRoute:
          dashboard:
            enabled: false
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
        ports:
          web:
            port: 80
            expose:
              default: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            port: 443
            expose:
              default: true
            transport:
              respondingTimeouts:
                readTimeout: "0s"
        metrics:
          prometheus:
            addEntryPointsLabels: true
            addRoutersLabels: true
            addServicesLabels: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
