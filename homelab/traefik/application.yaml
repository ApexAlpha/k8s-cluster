apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 39.0.6
    helm:
      values: |
        service:
          type: NodePort
          annotations:
            netbird.io/expose: "true"
            netbird.io/groups: "k8s-ingress"
        ingressRoute:
          dashboard:
            enabled: false
        providers:
          kubernetesIngress:
            publishedService:
              enabled: true
        ports:
          web:
            port: 80
            nodePort: 30080
            expose:
              default: true
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
                  permanent: true
          websecure:
            nodePort: 30443
            transport:
              respondingTimeouts:
                readTimeout: "0s"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
