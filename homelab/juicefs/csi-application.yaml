apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: juicefs-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://juicedata.github.io/charts
    chart: juicefs-csi-driver
    targetRevision: 0.31.3
    helm:
      valuesObject:
        controller:
          replicas: 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

        node:
          # hostNetwork: use the host network namespace so the CSI node plugin
          # reaches Garage at 127.0.0.1:3900 (local node) instead of going
          # cross-node. Garage is leaderless so hitting local is always valid
          # and saves a WAN hop on every S3 operation.
          hostNetwork: true
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          tolerations:
            - operator: Exists

        # StorageClass managed separately in juicefs/storageclass.yaml
        storageClasses: []

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
