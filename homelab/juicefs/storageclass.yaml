apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: juicefs
  annotations:
    argocd.argoproj.io/sync-wave: "17"
provisioner: csi.juicefs.com
# Retain: keeps JuiceFS subdir (and its data in Garage) alive after PVC deletion.
# Delete explicitly when you actually mean to discard data.
reclaimPolicy: Retain
# RWX: multiple pods on different nodes can mount simultaneously.
# This is what enables RollingUpdate on all consuming deployments.
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: juicefs-secret
  csi.storage.k8s.io/provisioner-secret-namespace: kube-system
  csi.storage.k8s.io/node-publish-secret-name: juicefs-secret
  csi.storage.k8s.io/node-publish-secret-namespace: kube-system
  # Metadata caching — reduces Postgres round-trips, important for Nextcloud small files
  # Data cache is less critical on LAN but kept for burst performance
  # cache-size=512: Garage is local LAN so large data cache wastes RAM with little benefit.
  # buffer-size=128: reduced from 256, sufficient for homelab workloads.
  # cache-size=10: Garage runs on localhost (hostNetwork), sub-ms latency makes large block
  # caches pointless. 10MB keeps hot metadata blocks without wasting RAM.
  # buffer-size=32: reduced from 128 — sufficient for homelab I/O on local LAN.
  # Saves ~150-175MB per mount pod (~2.5GB total across 17 pods).
  juicefs/mount-options: "cache-size=10,writeback,prefetch=1,buffer-size=32,max-uploads=10,attr-cache=300,entry-cache=300,dir-entry-cache=300,open-cache=300"
