apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: juicefs
  annotations:
    argocd.argoproj.io/sync-wave: "17"
provisioner: csi.juicefs.com
# Retain: keeps JuiceFS subdir (and its data in Garage) alive after PVC deletion.
# Delete explicitly when you actually mean to discard data.
reclaimPolicy: Retain
# RWX: multiple pods on different nodes can mount simultaneously.
# This is what enables RollingUpdate on all consuming deployments.
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  csi.storage.k8s.io/provisioner-secret-name: juicefs-secret
  csi.storage.k8s.io/provisioner-secret-namespace: kube-system
  csi.storage.k8s.io/node-publish-secret-name: juicefs-secret
  csi.storage.k8s.io/node-publish-secret-namespace: kube-system
