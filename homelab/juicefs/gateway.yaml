# JuiceFS S3 Gateway + WebDAV - exposes JuiceFS as S3 and WebDAV endpoints
# Used by CNPG barman backups, external clients (laptop backups), and emergency file access
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juicefs-gateway
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "18"
  labels:
    app: juicefs-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: juicefs-gateway
  template:
    metadata:
      labels:
        app: juicefs-gateway
    spec:
      # Use host network to reach local Garage at 127.0.0.1:3900
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: s3
          image: juicedata/mount:ee-5.1.4
          command:
            - juicefs
            - gateway
            - --multi-buckets
            - --keep-etag
            - $(METAURL)
            - 0.0.0.0:9000
          env:
            - name: METAURL
              valueFrom:
                secretKeyRef:
                  name: juicefs-secret
                  key: metaurl
            # Gateway S3 credentials - uses MinIO env vars (JuiceFS uses MinIO's S3 library internally)
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: juicefs-gateway-credentials
                  key: access-key
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: juicefs-gateway-credentials
                  key: secret-key
            # JuiceFS storage backend credentials (to reach Garage)
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: juicefs-secret
                  key: access-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: juicefs-secret
                  key: secret-key
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10

        - name: webdav
          image: juicedata/mount:ee-5.1.4
          command:
            - juicefs
            - webdav
            - $(METAURL)
            - 0.0.0.0:9007
          env:
            - name: METAURL
              valueFrom:
                secretKeyRef:
                  name: juicefs-secret
                  key: metaurl
            - name: WEBDAV_USER
              valueFrom:
                secretKeyRef:
                  name: juicefs-gateway-credentials
                  key: webdav-user
            - name: WEBDAV_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: juicefs-gateway-credentials
                  key: webdav-password
            # JuiceFS storage backend credentials (to reach Garage)
            - name: ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: juicefs-secret
                  key: access-key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: juicefs-secret
                  key: secret-key
          ports:
            - name: webdav
              containerPort: 9007
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 9007
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 9007
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: juicefs-s3-gateway
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "18"
spec:
  selector:
    app: juicefs-gateway
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: juicefs-webdav
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "18"
spec:
  selector:
    app: juicefs-gateway
  ports:
    - name: webdav
      port: 9007
      targetPort: 9007
---
# S3 external access for CNPG backups, laptop backups via rclone, etc.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: juicefs-s3-gateway
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - s3.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: s3.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: juicefs-s3-gateway
                port:
                  number: 9000
---
# WebDAV external access for emergency file access, native OS mounting
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: juicefs-webdav
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: "18"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - webdav.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: webdav.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: juicefs-webdav
                port:
                  number: 9007
