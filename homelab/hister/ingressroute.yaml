apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hister
  namespace: hister
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  entryPoints:
    - websecure
  routes:
    # Hermes runs on the LXC at 192.168.1.235. Keep MCP private to it.
    - kind: Rule
      match: Host(`hister.k8s.hu.ls`) && PathPrefix(`/mcp`) && ClientIP(`192.168.1.235`)
      priority: 20
      middlewares:
        - name: maintenance-errors
          namespace: nc-maintenance
      services:
        - name: hister
          port: 80
    - kind: Rule
      match: Host(`hister.k8s.hu.ls`)
      priority: 10
      middlewares:
        - name: maintenance-errors
          namespace: nc-maintenance
        - name: authentik
          namespace: authentik
      services:
        - name: hister
          port: 80
  tls:
    secretName: wildcard-k8s-hu-ls-tls
