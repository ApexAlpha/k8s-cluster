apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hister-data-longhorn
  namespace: hister
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: longhorn
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
