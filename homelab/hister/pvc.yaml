apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hister-data
  namespace: hister
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
    argocd.argoproj.io/sync-wave: "3"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
