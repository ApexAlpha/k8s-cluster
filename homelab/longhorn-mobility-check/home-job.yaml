apiVersion: batch/v1
kind: Job
metadata:
  name: verify-k3s-home
  namespace: longhorn-mobility-check
  annotations:
    argocd.argoproj.io/sync-wave: '31'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  template:
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-home
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: probe
        image: busybox:1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
        command:
        - sh
        - -ec
        - printf '%s\n' 'longhorn-mobility-check-2026-11-02' > /data/probe; sync;
          sha256sum /data/probe
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: probe-data
