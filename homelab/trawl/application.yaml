apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trawl
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  project: default
  source:
    repoURL: https://github.com/ApexAlpha/k8s-cluster.git
    path: homelab/trawl
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: trawl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
