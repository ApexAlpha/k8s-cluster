apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-shelfmark
  namespace: trawl
spec:
  podSelector:
    matchLabels:
      app: trawl
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shelfmark
      ports:
        - protocol: TCP
          port: 8191
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-prowlarr
  namespace: trawl
spec:
  podSelector:
    matchLabels:
      app: trawl
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: media
          podSelector:
            matchLabels:
              app: prowlarr
      ports:
        - protocol: TCP
          port: 8191
  policyTypes:
    - Ingress
