apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: trawl
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:8.10-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trawl
  namespace: trawl
  labels:
    app: trawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trawl
  template:
    metadata:
      labels:
        app: trawl
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-home
      imagePullSecrets:
        - name: ghcr-pull-secret
      # Camoufox/Firefox needs to write runtime files across /opt/camoufox;
      # running as non-root hangs browser launch (proven: worked as root on nuc).
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: trawl
          image: ghcr.io/germondai/trawl:latest@sha256:5c9988899ce42e1b85e89ca5d81b4c1fa82653ad97bf7169f9125367243dcc49
          imagePullPolicy: IfNotPresent
          # Camoufox/Firefox needs user namespaces for its sandbox; the default
          # k3s seccomp profile blocks unshare -> browser launch times out.
          securityContext:
            seccompProfile:
              type: Unconfined
          ports:
            - name: http
              containerPort: 8191
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: BROWSER_POOL_SIZE
              value: "1"
            - name: BROWSER_CONTENT_PROCESSES
              value: "2"
            - name: PORT
              value: "8191"
            - name: TZ
              value: "Europe/Amsterdam"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: addons
              mountPath: /opt/camoufox/addons
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: addons
          emptyDir: {}
