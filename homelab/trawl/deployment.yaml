apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: trawl
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.10-alpine@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trawl
  namespace: trawl
  labels:
    app: trawl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trawl
  template:
    metadata:
      labels:
        app: trawl
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-home
      imagePullSecrets:
        - name: ghcr-pull-secret
      # TRAWL supports a non-root runtime (UID/GID 1001). Keep the browser
      # writable paths on /tmp and the mounted addon directory.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: trawl
          image: ghcr.io/germondai/trawl:latest@sha256:3eb1f6a432606e2cbb025d81d3a6b8225f2e64288f056948f8756d88f7f66276
          imagePullPolicy: IfNotPresent
          # Re-test the browser sandbox under the Kubernetes default syscall
          # filter now that the image runs as non-root.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 8191
          env:
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: BROWSER_POOL_SIZE
              value: "1"
            - name: BROWSER_CONTENT_PROCESSES
              value: "2"
            - name: PORT
              value: "8191"
            - name: TZ
              value: "Europe/Amsterdam"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 12
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: shm
              mountPath: /dev/shm
            - name: addons
              mountPath: /opt/camoufox/addons
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: addons
          emptyDir: {}
