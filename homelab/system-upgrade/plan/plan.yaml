apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-server
  namespace: system-upgrade
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  # Upgrade one node at a time to maintain etcd quorum
  concurrency: 1
  # Track k3s stable channel
  channel: https://update.k3s.io/v1-release/channels/stable
  # Apply to all control-plane nodes (all 3 in this cluster)
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: node-role.kubernetes.io/master
      operator: Exists
      effect: NoSchedule
  serviceAccountName: system-upgrade
  cordon: true
  drain:
    force: true
    ignoreDaemonSets: true
    deleteEmptyDirData: true
    timeout: 300
  upgrade:
    image: rancher/k3s-upgrade
