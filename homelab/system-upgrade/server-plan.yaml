apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
  labels:
    app.kubernetes.io/part-of: system-upgrade
spec:
  concurrency: 1
  postCompleteDelay: "5m"
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  # Follow stable (currently 1.37.2); minor updates may briefly interrupt apps.
  # ArgoCD applies; controller moves nodes inside the nightly window.
  channel: https://update.k3s.io/v1-release/channels/stable
  upgrade:
    image: rancher/k3s-upgrade@sha256:69b48cf32cf51ed23ed86348fc913db1e00d1ddc00369ded18953dcad859a6e1
  # 02:00-03:00 Amsterdam local time, after 01:00-02:00 local backups.
  # Cordon only: no drain; existing pods can still see a short interruption.
  window:
    days:
      - sunday
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
    startTime: "02:00"
    endTime: "03:00"
    timeZone: Europe/Amsterdam