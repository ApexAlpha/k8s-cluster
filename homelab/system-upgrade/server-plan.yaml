apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
  labels:
    app.kubernetes.io/part-of: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  # PINNED to v1.35.6 (latest v1.35 patch) for the FIRST step from v1.34.
  # Once the cluster is on 1.35, flip this to:
  #   channel: https://update.k3s.io/v1-release/channels/stable
  # (see homelab/system-upgrade/README.md) so ongoing stable patches apply.
  version: v1.35.6+k3s1
  upgrade:
    image: rancher/k3s-upgrade
  # Nightly window AFTER all backups (compressed: velero 01:00, CNPG base
  # 00:00, garage-to-hetzner 02:00 UTC → all done ~02:00 UTC) and before you
  # wake. 04:30-06:00 Amsterdam time (Europe/Amsterdam; UTC+2 in summer).
  window:
    days:
      - sunday
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
    startTime: "04:30"
    endTime: "06:00"
    timeZone: Europe/Amsterdam