apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: server-plan
  namespace: system-upgrade
  labels:
    app.kubernetes.io/part-of: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: In
        values:
          - "true"
  serviceAccountName: system-upgrade
  # Track the k3s stable release channel (1.35 verified -> now 1.36+).
  # ArgoCD applies; controller moves nodes inside the nightly window.
  channel: https://update.k3s.io/v1-release/channels/stable
  upgrade:
    image: rancher/k3s-upgrade@sha256:692b819218ce7cd536a2610809fd477d6aa9fa17c3366c659902f7f39263e861
  # Nightly window AFTER all backups (compressed: velero 01:00, CNPG base
  # 00:00, garage-to-hetzner 02:00 UTC → all done ~02:00 UTC) and before you
  # wake. 04:30-06:00 Amsterdam time (Europe/Amsterdam; UTC+2 in summer).
  window:
    days:
      - sunday
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
    startTime: "02:00"
    endTime: "03:00"
    timeZone: Europe/Amsterdam