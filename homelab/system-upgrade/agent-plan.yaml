apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
  labels:
    app.kubernetes.io/part-of: system-upgrade
spec:
  concurrency: 1
  postCompleteDelay: "5m"
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  prepare:
    image: rancher/k3s-upgrade@sha256:69b48cf32cf51ed23ed86348fc913db1e00d1ddc00369ded18953dcad859a6e1
    args:
      - prepare
      - server-plan
  serviceAccountName: system-upgrade
  # Match server-plan: track stable after control-plane nodes complete.
  channel: https://update.k3s.io/v1-release/channels/stable
  upgrade:
    image: rancher/k3s-upgrade@sha256:69b48cf32cf51ed23ed86348fc913db1e00d1ddc00369ded18953dcad859a6e1
  # Nightly window after backups (see server-plan).
  window:
    days:
      - sunday
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
    startTime: "02:00"
    endTime: "03:00"
    timeZone: Europe/Amsterdam