apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: agent-plan
  namespace: system-upgrade
  labels:
    app.kubernetes.io/part-of: system-upgrade
spec:
  concurrency: 1
  cordon: true
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  prepare:
    image: rancher/k3s-upgrade@sha256:92acc1d7fab0219b0fbfe1e5b988e8cb995363e71ff213a78ead4494369ddd55
    args:
      - prepare
      - server-plan
  serviceAccountName: system-upgrade
  # Track the k3s stable release channel, alongside server-plan.
  channel: https://update.k3s.io/v1-release/channels/stable
  upgrade:
    image: rancher/k3s-upgrade@sha256:92acc1d7fab0219b0fbfe1e5b988e8cb995363e71ff213a78ead4494369ddd55
  # Nightly window after backups (see server-plan).
  window:
    days:
      - sunday
      - monday
      - tuesday
      - wednesday
      - thursday
      - friday
      - saturday
    startTime: "02:00"
    endTime: "03:00"
    timeZone: Europe/Amsterdam