# Traefik terminates TLS and proxies plain HTTP to argocd-server:80.
# ArgoCD already runs in insecure mode (server.insecure: "true" is set in
# argocd-install/install.yaml), so no redirect loop occurs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: "nc-maintenance-maintenance-errors@kubernetescrd"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argo.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: argo.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
