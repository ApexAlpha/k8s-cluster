# Tell ArgoCD to serve plain HTTP instead of HTTPS.
# Without this, ArgoCD redirects every incoming request to https:// and
# Traefik ends up in a redirect loop since it's already on the TLS side.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  server.insecure: "true"
---
# Standard HTTP ingress — Traefik terminates TLS, proxies plain HTTP to ArgoCD.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - argo.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: argo.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
