apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: immich-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      # Prefer running on the same node as PostgreSQL primary for lower latency
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    cnpg.io/cluster: postgres-shared
                    role: primary
                topologyKey: kubernetes.io/hostname
                namespaces:
                  - database
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release@sha256:1521a1c8c1727ec240e57585db7bf90a3b067066d4847baeb80f353d721f4d5a
          ports:
            - name: http
              containerPort: 2283
          env:
            # Database — shared CNPG cluster (same as paperless, vaultwarden)
            - name: DB_HOSTNAME
              value: "postgres-shared-rw.database.svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: DB_USERNAME
              value: "immich"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: IMMICH_PORT
              value: "2283"
            # Redis
            - name: REDIS_HOSTNAME
              value: "immich-redis"
            - name: REDIS_PORT
              value: "6379"

            # Machine Learning
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://immich-machine-learning:3003"

            # Timezone
            - name: TZ
              value: "Europe/Amsterdam"

          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload

          resources:
            requests:
              cpu: 1000m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4Gi

          startupProbe:
            exec:
              command:
                - immich-healthcheck
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 30    # Up to 5 min for first boot (migrations, etc.)
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - immich-healthcheck
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - immich-healthcheck
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
