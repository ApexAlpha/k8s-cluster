apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: immich-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release@sha256:0cc1f82953d9598eb9e9dd11cbde1f50fe54f9c46c4506b089e8ad7bfc9d1f0c
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2283
            - name: metrics
              containerPort: 8081
          env:
            # Database — shared CNPG cluster (same as paperless, vaultwarden)
            - name: DB_HOSTNAME
              value: "postgres-shared-rw.database.svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: DB_USERNAME
              value: "immich"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: IMMICH_PORT
              value: "2283"
            # Redis
            - name: REDIS_HOSTNAME
              value: "immich-redis"
            - name: REDIS_PORT
              value: "6379"

            # Machine Learning
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://immich-machine-learning:3003"

            # Timezone
            - name: TZ
              value: "Europe/Amsterdam"

            # Telemetry / Prometheus metrics (port 8081)
            - name: IMMICH_TELEMETRY_INCLUDE
              value: "all"

          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload

          resources:
            requests:
              cpu: 1000m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4Gi

          startupProbe:
            exec:
              command:
                - immich-healthcheck
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 30    # Up to 5 min for first boot (migrations, etc.)
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - immich-healthcheck
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - immich-healthcheck
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5

      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library
