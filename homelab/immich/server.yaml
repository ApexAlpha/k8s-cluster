apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app: immich-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-server
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: immich-server
          image: ghcr.io/immich-app/immich-server:release@sha256:b434cb9287eea1471c9974845914d4dd328c9c2d652e446ed4930f99944f0ceb
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 2283
            - name: metrics
              containerPort: 8081
          env:
            - name: DB_HOSTNAME
              value: "postgres-shared-pooler.database.svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE_NAME
              value: "immich"
            - name: DB_USERNAME
              value: "immich_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db
                  key: password
            - name: IMMICH_PORT
              value: "2283"
            - name: REDIS_HOSTNAME
              value: "immich-redis"
            - name: REDIS_PORT
              value: "6379"
            - name: IMMICH_MACHINE_LEARNING_URL
              value: "http://immich-machine-learning:3003"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: IMMICH_TELEMETRY_INCLUDE
              value: "all"
            - name: IMMICH_CONFIG_FILE
              value: "/usr/src/app/config.yaml"
            - name: IMMICH_OAUTH_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: immich-oauth
                  key: issuerUrl
            - name: IMMICH_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: immich-oauth
                  key: clientId
            - name: IMMICH_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: immich-oauth
                  key: clientSecret

          volumeMounts:
            - name: library
              mountPath: /usr/src/app/upload
            - name: config
              mountPath: /usr/src/app/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 1000m
              memory: 512Mi
            limits:
              cpu: 4000m
              memory: 4Gi
          startupProbe:
            exec:
              command:
                - immich-healthcheck
            initialDelaySeconds: 90
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - immich-healthcheck
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command:
                - immich-healthcheck
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: library
          persistentVolumeClaim:
            claimName: immich-library-local
        - name: config
          configMap:
            name: immich-config
