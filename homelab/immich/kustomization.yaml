apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - redis.yaml
  - server.yaml
  - machine-learning.yaml
  - service.yaml
  - ingress.yaml
  - immich-db-sealed.yaml
  - immich-oauth-sealed.yaml
  - configmap.yaml

patches:
  - path: patches/security-immich-server.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: immich-server
  - path: patches/security-immich-machine-learning.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: immich-machine-learning
  - path: patches/security-immich-redis.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: immich-redis
