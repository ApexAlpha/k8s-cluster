---
# Immich requires PostgreSQL with the VectorChord extension for AI-powered
# search and facial recognition. This cannot run on the shared CNPG cluster
# (vanilla PG16), so Immich gets its own dedicated cluster.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-postgres
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  description: "PostgreSQL with VectorChord for Immich"
  
  # Single instance is fine for a homelab photo library.
  # The photos themselves live on SeaweedFS (replicated).
  # Bump to 3 if you want HA for the metadata DB too.
  instances: 1
  
  # CNPG image with VectorChord baked in
  imageName: tensorchord/cloudnative-vectorchord:16.9-0.4.3
  
  primaryUpdateStrategy: unsupervised
  
  storage:
    storageClass: local-path
    size: 10Gi
  
  postgresql:
    shared_preload_libraries:
      - "vchord.so"
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      effective_cache_size: "256MB"
      work_mem: "8MB"
      maintenance_work_mem: "64MB"
    pg_hba:
      - host all all 10.0.0.0/8 scram-sha-256
      - host all all 100.64.0.0/10 scram-sha-256
  
  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: immich-db-credentials

  bootstrap:
    initdb:
      database: immich
      owner: immich
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube CASCADE;
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  
  monitoring:
    enablePodMonitor: false
---
# Pre-create the secret for the immich DB user.
# CHANGE THIS PASSWORD before deploying!
apiVersion: v1
kind: Secret
metadata:
  name: immich-db-credentials
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: kubernetes.io/basic-auth
stringData:
  username: immich
  password: "CHANGE-ME-to-a-real-password"
