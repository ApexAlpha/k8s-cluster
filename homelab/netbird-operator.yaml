apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird-operator
  namespace: argocd 
spec:
  project: default
  source:
    repoURL: https://netbirdio.github.io/helms
    chart: kubernetes-operator
    targetRevision: 0.2.2 
    helm:
      values: |
        ingress:
          enabled: true
          router:
            enabled: true
          policies:
            default:
              name: "Kubernetes services"
              sourceGroups:
                - "All"
        netbirdAPI:
          keyFromSecret:
            name: "netbird-mgmt-api-key"
            key: "NB_API_KEY"
  destination:
    server: https://kubernetes.default.svc
    namespace: netbird
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
