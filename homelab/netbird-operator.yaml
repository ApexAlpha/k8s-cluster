apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbird-operator
  namespace: argocd 
spec:
  project: default
  source:
    repoURL: https://charts.netbird.io
    chart: netbird-operator
    targetRevision: 0.2.0 
    helm:
      values: |
        ingress:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: netbird
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
