apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-shared
  namespace: database
spec:
  description: "Shared PostgreSQL cluster for homelab services"

  # High priority ensures postgres pods preempt app pods when resources are tight
  priorityClassName: database-critical

  # Single instance — control plane is on home VM, no point in replica
  instances: 1

  # Standard CNPG image — includes pgvector, PGAudit, Postgres Failover Slots
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  primaryUpdateStrategy: unsupervised

  # Pin to home VM node — uses local-path storage, must stay here
  nodeSelector:
    kubernetes.io/hostname: k3s-home

  storage:
    storageClass: local-path
    size: 20Gi

  postgresql:
    parameters:
      max_connections: "200"

      # Memory
      shared_buffers: "512MB"
      effective_cache_size: "1.5GB"
      work_mem: "16MB"
      maintenance_work_mem: "128MB"

      # WAL
      wal_level: replica
      max_wal_senders: "10"
      max_replication_slots: "10"

      synchronous_commit: "local"

      checkpoint_timeout: "15min"
      max_wal_size: "2GB"

      # Logging
      log_statement: "ddl"
      log_min_duration_statement: "1000"

    pg_hba:
      - host all all 10.0.0.0/8 scram-sha-256

  bootstrap:
    initdb:
      database: app
      owner: app
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vector CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance;
      postInitSQL:
        - CREATE DATABASE juicefs OWNER app;
        - CREATE DATABASE vaultwarden OWNER app;
        - CREATE DATABASE immich OWNER immich;
        - CREATE DATABASE nextcloud OWNER app;
        - CREATE DATABASE mealie OWNER app;
        - CREATE DATABASE grafana OWNER app;
        - CREATE DATABASE authentik OWNER app;

  backup:
    barmanObjectStore:
      destinationPath: s3://cnpg-backups/
      endpointURL: http://garage-s3.garage.svc.cluster.local:3900
      s3Credentials:
        accessKeyId:
          name: cnpg-s3-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-s3-creds
          key: SECRET_ACCESS_KEY

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

  managed:
    roles:
      - name: immich
        ensure: present
        connectionLimit: -1
        inherit: true
        login: true
        superuser: true
        createdb: true
        passwordSecret:
          name: immich-db-credentials

  monitoring:
    enablePodMonitor: false
