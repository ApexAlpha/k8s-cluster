apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-shared
  namespace: database
spec:
  description: "Shared PostgreSQL cluster for homelab services"

  # High priority ensures postgres pods preempt app pods when resources are tight
  priorityClassName: database-critical

  # Single instance — control plane is on home VM, no point in replica
  instances: 2

  # Standard CNPG image — includes pgvector, PGAudit, Postgres Failover Slots
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  primaryUpdateStrategy: unsupervised

  # Give PostgreSQL time to complete WAL recovery / pg_upgrade before the
  # liveness probe fires. Default startDelay is 3600 but livenessProbeTimeout
  # defaults to 5s which is too tight during heavy I/O migrations.
  startDelay: 300
  stopDelay: 300
  livenessProbeTimeout: 30

  # Spread primary and replica across nodes for zero-downtime rolling restarts
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  storage:
    storageClass: local-path
    size: 20Gi

  postgresql:
    parameters:
      max_connections: "300"

      # Memory
      shared_buffers: "1GB"
      effective_cache_size: "3GB"
      work_mem: "16MB"
      maintenance_work_mem: "128MB"

      # WAL
      wal_level: replica
      max_wal_senders: "10"
      max_replication_slots: "10"

      synchronous_commit: "local"

      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
      min_wal_size: "1GB"
      # Spread checkpoint writes over 90% of checkpoint_timeout to avoid I/O spikes
      checkpoint_completion_target: "0.9"

      # NVMe: random I/O is nearly as fast as sequential — planner should prefer index scans
      random_page_cost: "1.1"
      # NVMe supports high I/O parallelism; default (1) is tuned for spinning disks
      effective_io_concurrency: "200"
      maintenance_io_concurrency: "100"

      # Logging
      log_statement: "ddl"
      log_min_duration_statement: "1000"

    pg_hba:
      - host all all 10.0.0.0/8 scram-sha-256

  bootstrap:
    initdb:
      database: app
      owner: app
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vector CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance;
      postInitSQL:
        - CREATE DATABASE juicefs OWNER app;
        - CREATE DATABASE vaultwarden OWNER app;
        - CREATE DATABASE immich OWNER app;
        - CREATE DATABASE nextcloud OWNER app;
        - CREATE DATABASE mealie OWNER app;
        - CREATE DATABASE grafana OWNER app;
        - CREATE DATABASE authentik OWNER app;
        - CREATE DATABASE paperless OWNER app;
        - CREATE DATABASE "sonarr-main" OWNER app;
        - CREATE DATABASE "sonarr-log" OWNER app;
        - CREATE DATABASE "sonarr4k-main" OWNER app;
        - CREATE DATABASE "sonarr4k-log" OWNER app;
        - CREATE DATABASE "radarr-main" OWNER app;
        - CREATE DATABASE "radarr-log" OWNER app;
        - CREATE DATABASE "radarr4k-main" OWNER app;
        - CREATE DATABASE "radarr4k-log" OWNER app;
        - CREATE DATABASE "prowlarr-main" OWNER app;
        - CREATE DATABASE "prowlarr-log" OWNER app;
        - CREATE DATABASE bazarr OWNER app;


  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-backups/
      # Direct to Garage — removes circular dependency (JuiceFS → PG → JuiceFS backup)
      endpointURL: http://garage-s3.garage.svc.cluster.local:3900
      s3Credentials:
        accessKeyId:
          name: cnpg-barman-credentials
          key: access-key
        secretAccessKey:
          name: cnpg-barman-credentials
          key: secret-key
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "7d"

  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 4Gi


  monitoring:
    enablePodMonitor: false
