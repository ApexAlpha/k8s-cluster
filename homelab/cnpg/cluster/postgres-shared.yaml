apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-shared
  namespace: database
spec:
  description: "Shared PostgreSQL cluster for homelab services"

  managed:
    roles:
    - login: true
      name: sonarr_user
      passwordSecret:
        name: sonarr-user-password
    - login: true
      name: sonarr4k_user
      passwordSecret:
        name: sonarr4k-user-password
    - login: true
      name: radarr_user
      passwordSecret:
        name: radarr-user-password
    - login: true
      name: radarr4k_user
      passwordSecret:
        name: radarr4k-user-password
    - login: true
      name: prowlarr_user
      passwordSecret:
        name: prowlarr-user-password
    - login: true
      name: bazarr_user
      passwordSecret:
        name: bazarr-user-password
    - login: true
      name: immich_user
      passwordSecret:
        name: immich-user-password
    - login: true
      name: nextcloud_user
      passwordSecret:
        name: nextcloud-user-password
    - login: true
      name: mealie_user
      passwordSecret:
        name: mealie-user-password
    - login: true
      name: paperless_user
      passwordSecret:
        name: paperless-user-password
    - login: true
      name: vaultwarden_user
      passwordSecret:
        name: vaultwarden-user-password
    - login: true
      name: authentik_user
      passwordSecret:
        name: authentik-user-password
    - login: true
      name: grafana_user
      passwordSecret:
        name: grafana-user-password
    - login: true
      name: firefly_user
      passwordSecret:
        name: firefly-user-password
    - login: true
      name: stirling_user
      passwordSecret:
        name: stirling-user-password

  # High priority ensures postgres pods preempt app pods when resources are tight
  priorityClassName: database-critical

  # Single instance — control plane is on home VM, no point in replica
  instances: 2

  # Standard CNPG image — includes pgvector, PGAudit, Postgres Failover Slots
  imageName: ghcr.io/cloudnative-pg/postgresql:18

  primaryUpdateStrategy: unsupervised

  # Give PostgreSQL time to complete WAL recovery / pg_upgrade before the
  # liveness probe fires. Default startDelay is 3600 but livenessProbeTimeout
  # defaults to 5s which is too tight during heavy I/O migrations.
  startDelay: 300
  stopDelay: 300
  livenessProbeTimeout: 30

  # Spread primary and replica across nodes for zero-downtime rolling restarts
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  storage:
    storageClass: local-path
    size: 20Gi

  postgresql:
    parameters:
      max_connections: "300"

      # Memory
      shared_buffers: "1GB"
      effective_cache_size: "3GB"
      work_mem: "16MB"
      maintenance_work_mem: "128MB"

      # WAL
      wal_level: replica
      max_wal_senders: "10"
      max_replication_slots: "10"

      synchronous_commit: "local"

      checkpoint_timeout: "15min"
      max_wal_size: "2GB"
      min_wal_size: "1GB"
      # Spread checkpoint writes over 90% of checkpoint_timeout to avoid I/O spikes
      checkpoint_completion_target: "0.9"

      # NVMe: random I/O is nearly as fast as sequential — planner should prefer index scans
      random_page_cost: "1.1"
      # NVMe supports high I/O parallelism; default (1) is tuned for spinning disks
      effective_io_concurrency: "200"
      maintenance_io_concurrency: "100"

      # Logging
      log_statement: "ddl"
      log_min_duration_statement: "1000"

    pg_hba:
      - host all all 10.0.0.0/8 scram-sha-256

  bootstrap:
    initdb:
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vector CASCADE;
        - CREATE EXTENSION IF NOT EXISTS cube;
        - CREATE EXTENSION IF NOT EXISTS earthdistance;
      # Elke database krijgt zijn eigen per-app user als OWNER.
      # In PostgreSQL 18 heeft alleen pg_database_owner CREATE op schema public,
      # en die rol erven database-eigenaren automatisch — geen aparte schema GRANTs nodig.
      postInitSQL:
        - CREATE DATABASE vaultwarden OWNER vaultwarden_user;
        - CREATE DATABASE immich OWNER immich_user;
        - CREATE DATABASE nextcloud OWNER nextcloud_user;
        - CREATE DATABASE mealie OWNER mealie_user;
        - CREATE DATABASE grafana OWNER grafana_user;
        - CREATE DATABASE authentik OWNER authentik_user;
        - CREATE DATABASE paperless OWNER paperless_user;
        - CREATE DATABASE "sonarr-main" OWNER sonarr_user;
        - CREATE DATABASE "sonarr-log" OWNER sonarr_user;
        - CREATE DATABASE "sonarr4k-main" OWNER sonarr4k_user;
        - CREATE DATABASE "sonarr4k-log" OWNER sonarr4k_user;
        - CREATE DATABASE "radarr-main" OWNER radarr_user;
        - CREATE DATABASE "radarr-log" OWNER radarr_user;
        - CREATE DATABASE "radarr4k-main" OWNER radarr4k_user;
        - CREATE DATABASE "radarr4k-log" OWNER radarr4k_user;
        - CREATE DATABASE "prowlarr-main" OWNER prowlarr_user;
        - CREATE DATABASE "prowlarr-log" OWNER prowlarr_user;
        - CREATE DATABASE bazarr OWNER bazarr_user;
        - CREATE DATABASE firefly OWNER firefly_user;


  backup:
    barmanObjectStore:
      destinationPath: s3://postgres-backups/
      # Direct to Garage — removes circular dependency (JuiceFS → PG → JuiceFS backup)
      endpointURL: http://garage-s3.garage.svc.cluster.local:3900
      s3Credentials:
        accessKeyId:
          name: cnpg-barman-credentials
          key: access-key
        secretAccessKey:
          name: cnpg-barman-credentials
          key: secret-key
        region:
          name: cnpg-barman-credentials
          key: region
      wal:
        compression: gzip
      data:
        compression: gzip
    retentionPolicy: "7d"
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 4Gi


  monitoring:
    enablePodMonitor: false

