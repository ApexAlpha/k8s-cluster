apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-shared-secret-reader
  namespace: database
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-shared-secret-reader
  namespace: database
subjects:
- kind: ServiceAccount
  name: postgres-shared
  namespace: database
roleRef:
  kind: Role
  name: postgres-shared-secret-reader
  apiGroup: rbac.authorization.k8s.io
