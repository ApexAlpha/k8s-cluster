# Weekly backup Sunday 01:20 CEST (Sat 23:20 UTC) — restore anchor + continuous WAL for PITR
# NOTE: daily base reverted 2026-08-08. Weekly + WAL is the better model:
#   - continuous WAL archiving already gives minute-level PITR for the 7d window
#   - daily base adds no recovery granularity, just ~7 extra full copies in-window
#     (cluster retentionPolicy 7d applies to ALL bases; CNPG has no per-backup retention)
#   - long-term history lives on Hetzner (rclone copy archive, 60d) + monthly snapshots
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-shared-weekly
  namespace: database
spec:
  schedule: "20 23 * * 6"
  backupOwnerReference: self
  cluster:
    name: postgres-shared
