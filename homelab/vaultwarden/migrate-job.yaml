apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-config
  namespace: vaultwarden
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        kubernetes.io/hostname: k3s-nuc
      containers:
        - name: migrate
          image: busybox
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> vaultwarden"
              cp -av /old/. /new/
              echo "==> Done"
          volumeMounts:
            - name: old
              mountPath: /old
            - name: new
              mountPath: /new
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: vaultwarden-data
        - name: new
          persistentVolumeClaim:
            claimName: vaultwarden-data-local
