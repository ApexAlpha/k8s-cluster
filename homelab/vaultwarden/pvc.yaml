apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data-local
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true,Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
