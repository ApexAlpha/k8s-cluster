apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data-longhorn
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  storageClassName: longhorn
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
