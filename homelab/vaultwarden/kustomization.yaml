apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - vaultwarden-db-sealed.yaml
  - vaultwarden-admin-sealed.yaml
  - longhorn-claims.yaml

patches:
  - path: patches/security-vaultwarden.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: vaultwarden
