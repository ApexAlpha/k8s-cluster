apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky-home
  namespace: blocky
  labels:
    app: blocky
    blocky-instance: home
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blocky
      blocky-instance: home
  template:
    metadata:
      labels:
        app: blocky
        blocky-instance: home
    spec:
      priorityClassName: dns-critical
      nodeSelector:
        kubernetes.io/hostname: k3s-home
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: blocky
          image: ghcr.io/0xerr0r/blocky:latest@sha256:2e5696efe4f920a9c07efa5587650fb94e7c4dc68759a77debde3daaa1e30cdb
          imagePullPolicy: IfNotPresent
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 4000
          volumeMounts:
            - name: config
              mountPath: /app/config.yml
              subPath: config.yml
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 53
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: blocky-config
