apiVersion: v1
kind: Service
metadata:
  name: blocky
  namespace: blocky
  labels:
    app: blocky
spec:
  type: ClusterIP
  selector:
    app: blocky
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: blocky-home
  namespace: blocky
  labels:
    blocky-instance: home
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.254
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: blocky
    blocky-instance: home
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: blocky-nuc
  namespace: blocky
  labels:
    blocky-instance: nuc
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.253
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: blocky
    blocky-instance: nuc
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
