apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - priority-class.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

patches:
  - path: patches/security-blocky-home.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: blocky-home
  - path: patches/security-blocky-nuc.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: blocky-nuc
