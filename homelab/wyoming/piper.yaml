apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-piper
  namespace: wyoming
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wyoming-piper
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: wyoming-piper
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-nuc
      containers:
        - name: piper
          image: rhasspy/wyoming-piper:2.4.3@sha256:f7aaafe325d18979f43a9fe8bb4db494ba28ce8c109cb982983157817705ff87
          args:
            # Dutch (primary) — Pim is the most natural standard Dutch voice
            - --voice
            - nl_NL-pim-medium
            # English fallback
            - --voice
            - en_US-ryan-high
            - --uri
            - tcp://0.0.0.0:10200
            - --data-dir
            - /data
            - --download-dir
            - /data
          ports:
            - name: wyoming
              containerPort: 10200
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 10200
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 10200
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: piper-data
---
apiVersion: v1
kind: Service
metadata:
  name: wyoming-piper
  namespace: wyoming
spec:
  selector:
    app: wyoming-piper
  ports:
    - name: wyoming
      port: 10200
      targetPort: 10200
