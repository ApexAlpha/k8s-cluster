apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

patches:
  - path: patches/security-searxng.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: searxng
