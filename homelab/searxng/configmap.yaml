apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: searxng
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  settings.yml: |
    use_default_settings: true

    server:
      # Generate with: openssl rand -hex 32
      secret_key: "CHANGE_ME_REPLACE_WITH_RANDOM_32_BYTE_HEX_STRING"
      base_url: "https://search.k8s.hu.ls/"
      bind_address: "0.0.0.0"
      port: 8080

    search:
      safe_search: 0
      autocomplete: ""
      default_lang: "auto"

    ui:
      static_use_hash: true
      default_theme: simple

    # JSON API enabled by default — openclaw can query:
    # https://search.k8s.hu.ls/search?format=json&q=<query>
    # or in-cluster via http://searxng.searxng.svc.cluster.local:8080
