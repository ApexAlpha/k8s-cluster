apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: searxng
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  settings.yml: |
    use_default_settings: true

    server:
      # Generate with: openssl rand -hex 32
      secret_key: "CHANGE_ME_REPLACE_WITH_RANDOM_32_BYTE_HEX_STRING"
      base_url: "https://search.k8s.hu.ls/"
      bind_address: "0.0.0.0"
      port: 8080

    search:
      safe_search: 0
      autocomplete: ""
      default_lang: "en"
      formats:
        - html
        - json

    outgoing:
      request_timeout: 10.0
      max_request_timeout: 30.0
      pool_connections: 100
      pool_maxsize: 20

    ui:
      static_use_hash: true
      default_theme: simple

    # Disable bot detection — breaks programmatic API access
    server:
      limiter: false

    # openclaw API: https://search.k8s.hu.ls/search?format=json&q=<query>
    # Returns: results[].url, results[].title, results[].content
