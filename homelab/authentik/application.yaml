apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: 2026.5.3
    helm:
      valuesObject:
        global:
          imagePullSecrets:
            - name: ghcr-pull-secret
        authentik:
          postgresql:
            host: postgres-shared-rw.database.svc.cluster.local
            name: authentik
            user: authentik_user
            conn_max_age: 0
          redis:
            host: authentik-redis-master

        # Use external CNPG cluster
        postgresql:
          enabled: false

        # Redis for sessions and cache
        redis:
          enabled: true
          image:
            registry: docker.io
            repository: bitnami/redis
            tag: latest

        server:
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: secret_key
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: pg_pass
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.tls: "true"
            hosts:
              - auth.k8s.hu.ls
            tls:
              - secretName: wildcard-k8s-hu-ls-tls
                hosts:
                  - auth.k8s.hu.ls

          metrics:
            enabled: true
            serviceMonitor:
              enabled: true

        worker:
          replicas: 1
          startupProbe:
            failureThreshold: 60
            periodSeconds: 10
          env:
            - name: AUTHENTIK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: secret_key
            - name: AUTHENTIK_POSTGRESQL__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authentik-secret
                  key: pg_pass

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
