apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-cron
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: nextcloud
    app.kubernetes.io/component: cron
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nextcloud
            app.kubernetes.io/component: cron
        spec:
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: nextcloud
                      app.kubernetes.io/component: app
                  topologyKey: kubernetes.io/hostname
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: nextcloud-cron
              image: docker.io/library/nextcloud:35.0.3-fpm@sha256:d94f573f34403c0ffa4292a244d572a53cae17963c44078636e2e64ef234e75b
              imagePullPolicy: IfNotPresent
              command: ["php", "-f", "/var/www/html/cron.php"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 33
                runAsGroup: 33
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: nextcloud-main
                  mountPath: /var/www/
                  subPath: root
                - name: nextcloud-main
                  mountPath: /var/www/html
                  subPath: html
                - name: nextcloud-main
                  mountPath: /var/www/html/data
                  subPath: data
                - name: nextcloud-main
                  mountPath: /var/www/html/config
                  subPath: config
                - name: nextcloud-main
                  mountPath: /var/www/html/custom_apps
                  subPath: custom_apps
                - name: nextcloud-main
                  mountPath: /var/www/tmp
                  subPath: tmp
                - name: nextcloud-main
                  mountPath: /var/www/html/themes
                  subPath: themes
          volumes:
            - name: nextcloud-main
              persistentVolumeClaim:
                claimName: nextcloud-files-longhorn
