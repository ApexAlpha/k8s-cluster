apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://nextcloud.github.io/helm/
    chart: nextcloud
    targetRevision: 9.0.3
    helm:
      valuesObject:
        # ─── FPM mode with nginx sidecar ───────────────────────────────
        image:
          flavor: fpm
          tag: 33.0.0-fpm
          pullPolicy: IfNotPresent

        replicaCount: 1

        strategy:
          type: Recreate

        # ─── Lifecycle hooks ──────────────────────────────────────────
        # Disable maintenance mode before the pod is killed so the
        # replacement pod does not find a stale lock in the DB.
        lifecycle:
          preStopCommand:
            - /bin/sh
            - -c
            - php /var/www/html/occ maintenance:mode --off || true

        nginx:
          enabled: true
          image:
            repository: nginx
            tag: alpine
          config:
            default: true

        # ─── Nextcloud core settings ───────────────────────────────────
        nextcloud:
          host: office.k8s.hu.ls

          # Hooks run by the Nextcloud Docker entrypoint.
          # Clear stale maintenance mode left by a crashed / replaced pod.
          hooks:
            before-starting: |-
              php /var/www/html/occ maintenance:mode --off 2>/dev/null || true
          
          existingSecret:
            enabled: true
            secretName: nextcloud-credentials
            usernameKey: username
            passwordKey: password
          
          # Additional PHP config files mounted into /var/www/html/config/
          configs:
            proxy.config.php: |-
              <?php
              $CONFIG = array (
                'trusted_proxies' => array(
                  0 => '127.0.0.1',
                  1 => '10.0.0.0/8',
                ),
                'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
              );
            
            previews.config.php: |-
              <?php
              $CONFIG = array (
                'enable_previews' => true,
                'enabledPreviewProviders' => array (
                  'OC\Preview\PNG',
                  'OC\Preview\JPEG',
                  'OC\Preview\GIF',
                  'OC\Preview\BMP',
                  'OC\Preview\XBitmap',
                  'OC\Preview\MP3',
                  'OC\Preview\TXT',
                  'OC\Preview\MarkDown',
                  'OC\Preview\PDF',
                ),
              );

          phpConfigs:
            zz-nextcloud.ini: |-
              memory_limit=512M
              upload_max_filesize=16G
              post_max_size=16G
              max_execution_time=3600
              max_input_time=3600

          # File storage via JuiceFS (provides compression & encryption over Garage S3)
          objectStore:
            s3:
              enabled: false

        # ─── HTTPS behind Traefik ─────────────────────────────────────
        phpClientHttpsFix:
          enabled: true
          protocol: https

        # ─── External PostgreSQL (CNPG shared cluster) ─────────────────
        internalDatabase:
          enabled: false

        externalDatabase:
          enabled: true
          type: postgresql
          host: postgres-shared-rw.database.svc:5432
          database: nextcloud
          user: app
          existingSecret:
            enabled: true
            secretName: nextcloud-db-credentials
            usernameKey: db-username
            passwordKey: password

        # ─── Bundled Redis (Bitnami subchart) ──────────────────────────
        redis:
          enabled: true
          auth:
            enabled: true
            # Password auto-generated by the Bitnami chart
          architecture: standalone
          master:
            persistence:
              enabled: true
              storageClass: juicefs
              accessMode: ReadWriteMany
              size: 1Gi
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                memory: 256Mi

        # ─── Ingress via Traefik ───────────────────────────────────────
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd
          tls:
            - hosts:
                - office.k8s.hu.ls
              secretName: wildcard-k8s-hu-ls-tls

        # Traefik sticky sessions (annotation goes on the Service, not Ingress)
        service:
          type: ClusterIP
          annotations:
            traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
            traefik.ingress.kubernetes.io/service.sticky.cookie.name: nextcloud-sticky
            traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"

        # ─── Persistence ───────────────────────────────────────────────
        # JuiceFS provides compression & encryption over Garage S3 backend
        persistence:
          enabled: true
          storageClass: juicefs
          accessMode: ReadWriteMany
          size: 100Gi

        # ─── Cron (sidecar) ───────────────────────────────────────────
        cronjob:
          enabled: true
          type: sidecar

        # ─── Probes (generous timeouts for network storage) ────────────
        startupProbe:
          enabled: true
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
          successThreshold: 1

        livenessProbe:
          enabled: true
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        readinessProbe:
          enabled: true
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        # ─── Resources ────────────────────────────────────────────────
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 2Gi

        # ─── Extra manifests (TLS Certificate) ────────────────────────
        extraManifests:
          nextcloud-certificate:
            apiVersion: cert-manager.io/v1
            kind: Certificate
            metadata:
              name: wildcard-k8s-hu-ls
            spec:
              secretName: wildcard-k8s-hu-ls-tls
              issuerRef:
                name: letsencrypt-prod
                kind: ClusterIssuer
              dnsNames:
                - "*.k8s.hu.ls"
                - "k8s.hu.ls"

  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
