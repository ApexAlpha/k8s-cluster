apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nextcloud
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://nextcloud.github.io/helm/
    chart: nextcloud
    targetRevision: 9.2.0
    helm:
      valuesObject:
        # ─── FPM + Nginx sidecar ────────────────────────────────────
        image:
          flavor: fpm-alpine
          tag: 33.0.1-fpm-alpine
          pullPolicy: IfNotPresent

        replicaCount: 1

        # Fix data directory permissions for www-data
        securityContext:
          fsGroup: 33

        # Suppress Apache ServerName warning
        extraEnv:
          - name: TRUSTED_PROXIES
            value: "10.0.0.0/8"

        strategy:
          type: Recreate

        # ─── Lifecycle hooks ──────────────────────────────────────────
        # Disable maintenance mode before the pod is killed so the
        # replacement pod does not find a stale lock in the DB.
        lifecycle:
          preStopCommand:
            - /bin/sh
            - -c
            - php /var/www/html/occ maintenance:mode --off || true

        nginx:
          enabled: true

        # ─── Nextcloud core settings ───────────────────────────────────
        nextcloud:
          host: office.k8s.hu.ls

          # Hooks run by the Nextcloud Docker entrypoint.
          # Clear stale maintenance mode left by a crashed / replaced pod.
          hooks:
            before-starting: |-
              php /var/www/html/occ maintenance:mode --off 2>/dev/null || true
          
          existingSecret:
            enabled: true
            secretName: nextcloud-credentials
            usernameKey: username
            passwordKey: password
          
          # Additional PHP config files mounted into /var/www/html/config/
          configs:
            proxy.config.php: |-
              <?php
              $CONFIG = array (
                'trusted_proxies' => array(
                  0 => '127.0.0.1',
                  1 => '10.0.0.0/8',
                ),
                'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
                'overwrite.cli.url' => 'https://office.k8s.hu.ls',
                'overwriteprotocol' => 'https',
                # OIDC: allow HTTP requests to local/private IPs
                # (auth.k8s.hu.ls resolves to 192.168.1.245, blocked by DNS pinning)
                'allow_local_remote_servers' => true,
              );
            
            previews.config.php: |-
              <?php
              $CONFIG = array (
                'enable_previews' => true,
                'enabledPreviewProviders' => array (
                  'OC\Preview\PNG',
                  'OC\Preview\JPEG',
                  'OC\Preview\GIF',
                ),
              );

            skip-permissions.config.php: |-
              <?php
              $CONFIG = array (
                'check_data_directory_permissions' => false,
              );

            trusted-domains.config.php: |-
              <?php
              $CONFIG = array (
                'trusted_domains' => array (
                  0 => 'localhost',
                  1 => 'office.k8s.hu.ls',
                ),
              );

          phpConfigs:
            zz-nextcloud.ini: |-
              memory_limit=512M
              upload_max_filesize=16G
              post_max_size=16G
              max_execution_time=3600
              max_input_time=3600
              opcache.enable=1
              opcache.memory_consumption=256
              opcache.interned_strings_buffer=32
              opcache.max_accelerated_files=20000
              opcache.revalidate_freq=2
              opcache.save_comments=1
              opcache.jit=1255
              opcache.jit_buffer_size=64M

          # File storage via JuiceFS (provides compression & encryption over Garage S3)
          objectStore:
            s3:
              enabled: false

        # ─── HTTPS behind Traefik ─────────────────────────────────────
        phpClientHttpsFix:
          enabled: true
          protocol: https

        # ─── External PostgreSQL (CNPG shared cluster) ─────────────────
        internalDatabase:
          enabled: false

        externalDatabase:
          enabled: true
          type: postgresql
          host: postgres-shared-rw.database.svc:5432
          database: nextcloud
          user: nextcloud_user
          existingSecret:
            enabled: true
            secretName: nextcloud-db-credentials
            usernameKey: db-username
            passwordKey: password

        # ─── Bundled Redis (Bitnami subchart) ──────────────────────────
        redis:
          enabled: true
          auth:
            enabled: true
            # Password auto-generated by the Bitnami chart
          architecture: standalone
          master:
            persistence:
              enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 50m
                memory: 256Mi

        # ─── Ingress via Traefik ───────────────────────────────────────
        ingress:
          enabled: true
          className: traefik
          annotations:
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd
          tls:
            - hosts:
                - office.k8s.hu.ls
              secretName: wildcard-k8s-hu-ls-tls

        # Traefik sticky sessions (annotation goes on the Service, not Ingress)
        service:
          type: ClusterIP
          annotations:
            traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
            traefik.ingress.kubernetes.io/service.sticky.cookie.name: nextcloud-sticky
            traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"

        # ─── Persistence ───────────────────────────────────────────────
        # JuiceFS provides compression & encryption over Garage S3 backend
        persistence:
          enabled: true
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 100Gi
          annotations:
            argocd.argoproj.io/skip-health-check: "true"

        # ─── Cron (sidecar) ───────────────────────────────────────────
        cronjob:
          enabled: true
          type: sidecar

        # ─── Probes (disabled during first install, re-enable after) ───
        startupProbe:
          enabled: true
          path: /status.php
          port: 8080
          scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 60

        livenessProbe:
          enabled: true
          path: /status.php
          port: 8080
          scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          enabled: true
          path: /status.php
          port: 8080
          scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3

        # ─── Resources ────────────────────────────────────────────────
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi

  destination:
    server: https://kubernetes.default.svc
    namespace: nextcloud

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
