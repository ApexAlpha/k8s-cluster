apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - application.yaml
  - nextcloud-credentials-sealed.yaml
  - nextcloud-db-credentials-sealed.yaml
patches:
  # Add liveness + readiness probes to the FPM main container (Helm chart only probes nginx sidecar)
  - path: patches/fpm-probes.yaml
    target:
      kind: Deployment
      name: nextcloud
  # Add liveness + readiness probes to the cron sidecar container
  - path: patches/cron-probes.yaml
    target:
      kind: Deployment
      name: nextcloud-cron
