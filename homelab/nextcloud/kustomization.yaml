apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - application.yaml
  - nextcloud-credentials-sealed.yaml
  - nextcloud-db-credentials-sealed.yaml
patches:
  # Add liveness + readiness probes to the FPM main container and cron sidecar.
  # The Helm chart only probes the nginx sidecar; we patch both remaining containers.
  - path: patches/fpm-probes.yaml
    target:
      kind: Deployment
      name: nextcloud
