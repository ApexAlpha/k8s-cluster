apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-files-longhorn
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 100Gi
