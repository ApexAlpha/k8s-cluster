apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 85.3.0
    helm:
      values: |
        grafana:
          # kubectl create secret generic grafana-admin -n monitoring \
          #   --from-literal=admin-user=admin \
          #   --from-literal=admin-password=<password>
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # kubectl create secret generic grafana-db -n monitoring \
          #   --from-literal=password=<password>
          env:
            GF_DATABASE_TYPE: postgres
            GF_DATABASE_HOST: postgres-shared-pooler.database.svc:5432
            GF_DATABASE_NAME: grafana
            GF_DATABASE_USER: app
            # OIDC / Authentik SSO
            GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
            GF_AUTH_GENERIC_OAUTH_NAME: Authentik
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
            GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
            GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://auth.k8s.hu.ls/application/o/authorize/
            GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://auth.k8s.hu.ls/application/o/token/
            GF_AUTH_GENERIC_OAUTH_API_URL: https://auth.k8s.hu.ls/application/o/userinfo/
            GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
            GF_AUTH_SIGNOUT_REDIRECT_URL: https://auth.k8s.hu.ls/application/o/grafana/end-session/
            # Allow users to login with OAuth or local admin
            GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
            GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: "false"
            # Disable Grafana's own login form? No, keep it for local admin fallback
            GF_AUTH_DISABLE_LOGIN_FORM: "false"
            GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups, 'GrafanaAdmin') && 'Admin' || contains(groups, 'GrafanaEditor') && 'Editor' || 'Viewer'"
            GF_AUTH_GENERIC_OAUTH_ALLOWED_DOMAINS: hu.ls
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oauth
                key: client-secret
            GF_DATABASE_PASSWORD:
              secretKeyRef:
                name: grafana-db
                key: password
          persistence:
            enabled: false
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.tls: "true"
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
            hosts:
              - grafana.k8s.hu.ls
            tls:
              - hosts:
                  - grafana.k8s.hu.ls
                secretName: wildcard-k8s-hu-ls-tls
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy

        prometheus:
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi
            # Resource requests/limits for Prometheus and its sidecars
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 4Gi

            # WAL replay can take >5min on large datasets; give it time before probes kill the pod
            startupProbe:
              httpGet:
                path: /-/ready
                port: http-web
                scheme: HTTP
              initialDelaySeconds: 0
              periodSeconds: 15
              failureThreshold: 60
              timeoutSeconds: 3

            # Discover ServiceMonitors/PodMonitors in all namespaces
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

        prometheusOperator:
          admissionWebhooks:
            enabled: false

        alertmanager:
          enabled: false

        nodeExporter:
          enabled: true

        kubeStateMetrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
