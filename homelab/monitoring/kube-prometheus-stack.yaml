apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "20"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 85.0.3
    helm:
      values: |
        grafana:
          # kubectl create secret generic grafana-admin -n monitoring \
          #   --from-literal=admin-user=admin \
          #   --from-literal=admin-password=<password>
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          # kubectl create secret generic grafana-db -n monitoring \
          #   --from-literal=password=<password>
          env:
            GF_DATABASE_TYPE: postgres
            GF_DATABASE_HOST: postgres-shared-pooler.database.svc:5432
            GF_DATABASE_NAME: grafana
            GF_DATABASE_USER: app
          envValueFrom:
            GF_DATABASE_PASSWORD:
              secretKeyRef:
                name: grafana-db
                key: password
          persistence:
            enabled: false
          ingress:
            enabled: true
            ingressClassName: traefik
            annotations:
              traefik.ingress.kubernetes.io/router.tls: "true"
              traefik.ingress.kubernetes.io/router.entrypoints: websecure
            hosts:
              - grafana.k8s.hu.ls
            tls:
              - hosts:
                  - grafana.k8s.hu.ls
                secretName: wildcard-k8s-hu-ls-tls
          additionalDataSources:
            - name: Loki
              type: loki
              url: http://loki.monitoring.svc.cluster.local:3100
              access: proxy

        prometheus:
          prometheusSpec:
            retention: 30d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 20Gi
            # WAL replay can take >5min on large datasets; give it time before probes kill the pod
            startupProbe:
              httpGet:
                path: /-/ready
                port: http-web
                scheme: HTTP
              initialDelaySeconds: 0
              periodSeconds: 15
              failureThreshold: 60
              timeoutSeconds: 3

            # Discover ServiceMonitors/PodMonitors in all namespaces
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false

        prometheusOperator:
          admissionWebhooks:
            enabled: false

        alertmanager:
          enabled: false

        nodeExporter:
          enabled: true

        kubeStateMetrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
