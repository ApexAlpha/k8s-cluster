apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  annotations: {}
  labels:
    release: kube-prometheus-stack
  name: home-assistant
  namespace: monitoring
spec:
  endpoints:
  - bearerTokenSecret:
      key: bearerToken
      name: ha-prometheus-token
    interval: 60s
    path: /api/prometheus
    port: metrics
  selector:
    matchLabels:
      app: ha-metrics
