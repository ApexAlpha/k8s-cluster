apiVersion: batch/v1
kind: Job
metadata:
  name: stirling-data-migrate
  namespace: stirling-pdf
  annotations:
    argocd.argoproj.io/sync-wave: '3'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: stirling-data-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: k3s-nuc
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: copy-and-verify
        image: stirlingtools/stirling-pdf:latest@sha256:c6872dd056b0046a14c5de1e9970283e7f1e1ff685bb08090c6b37a231127d31
        imagePullPolicy: IfNotPresent
        command:
        - /usr/bin/python3
        - -c
        - "import collections,hashlib,json,os,stat,subprocess\nfrom pathlib import\
          \ Path\nsource=Path('/source');target=Path('/target')\nassert (source/'configs').is_dir()\
          \ and (source/'customFiles').is_dir()\nassert not [p for p in target.iterdir()\
          \ if p.name!='lost+found'], 'Target must be empty'\ndef fail(e): raise e\n\
          def manifest(root):\n    result={}\n    for parent,dirs,files in os.walk(root,followlinks=False,onerror=fail):\n\
          \        if Path(parent)==root: dirs[:]=[d for d in dirs if d!='lost+found']\n\
          \        dirs.sort();files.sort()\n        for name in dirs+files:\n   \
          \         p=Path(parent)/name;s=p.lstat();item={'mode':stat.S_IMODE(s.st_mode),'uid':s.st_uid,'gid':s.st_gid,'mtime_ns':s.st_mtime_ns}\n\
          \            if stat.S_ISREG(s.st_mode):\n                h=hashlib.sha256()\n\
          \                with p.open('rb') as f:\n                    for chunk\
          \ in iter(lambda:f.read(1024*1024),b''): h.update(chunk)\n             \
          \   item.update(type='file',size=s.st_size,sha256=h.hexdigest())\n     \
          \       elif stat.S_ISDIR(s.st_mode):item['type']='directory'\n        \
          \    elif stat.S_ISLNK(s.st_mode):item.update(type='symlink',target=os.readlink(p))\n\
          \            else:raise RuntimeError('Unsupported special file in source')\n\
          \            result[str(p.relative_to(root))]=item\n    return result\n\
          before=manifest(source)\nsubprocess.run(['cp','-a','/source/.','/target/'],check=True)\n\
          subprocess.run(['sync','-f','/target'],check=True)\nafter=manifest(target)\n\
          assert before==manifest(source),'Source changed during copy'\nassert before==after,'File\
          \ content/metadata verification failed'\nfor attr in ['st_uid','st_gid','st_mode']:\n\
          \    assert getattr(source.stat(),attr)==getattr(target.stat(),attr),'Root\
          \ ownership/mode mismatch'\nassert (target/'configs').is_dir() and (target/'customFiles').is_dir()\n\
          print(json.dumps({'verified':True,'entries':len(before),'types':dict(collections.Counter(x['type']\
          \ for x in before.values())),'file_bytes':sum(x.get('size',0) for x in before.values()),'manifest_sha256':hashlib.sha256(json.dumps(before,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'checks':['file-content','uid','gid','mode','mtime','symlink-target','source-stability']},sort_keys=True),flush=True)\n"
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
        - name: target
          mountPath: /target
      volumes:
      - name: source
        persistentVolumeClaim:
          claimName: stirling-pdf-data-local
          readOnly: true
      - name: target
        persistentVolumeClaim:
          claimName: stirling-pdf-data-longhorn
