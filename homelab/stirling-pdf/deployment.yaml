apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:latest@sha256:5737322ca558f881f5a7823a53c43b4fe48bf28103f62b2d0f2ec748d0bc5e80  # Pin with digest — Renovate will manage this
          ports:
            - name: http
              containerPort: 8080
          env:
            # DOCKER_ENABLE_SECURITY was deprecated in v0.44 — use SECURITY_ENABLE_LOGIN instead.
            # Both are kept for compatibility during the Renovate-managed upgrade window.
            - name: DOCKER_ENABLE_SECURITY
              value: "false"
            - name: SECURITY_ENABLE_LOGIN
              value: "false"
            - name: INSTALL_BOOK_AND_ADVANCED_HTML_OPS
              value: "true"
            - name: LANGS
              value: "en_GB"
            # PostgreSQL configuration
            - name: SYSTEM_DATASOURCE_ENABLECUSTOMDATABASE
              value: "true"
            - name: SYSTEM_DATASOURCE_CUSTOMDATABASEURL
              value: "jdbc:postgresql://postgres-shared-rw.database.svc:5432/stirling"
            - name: SYSTEM_DATASOURCE_CUSTOMDATABASEUSERNAME
              value: "stirling"
            - name: SYSTEM_DATASOURCE_CUSTOMDATABASEPASSWORD
              valueFrom:
                secretKeyRef:
                  name: stirling-db-credentials
                  key: password
          volumeMounts:
            - name: configs
              mountPath: /configs        # settings.yml + user/auth database
            - name: custom
              mountPath: /customFiles    # branding, CSS, JS overrides
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: configs
          persistentVolumeClaim:
            claimName: stirling-pdf-configs
        - name: custom
          persistentVolumeClaim:
            claimName: stirling-pdf-custom
