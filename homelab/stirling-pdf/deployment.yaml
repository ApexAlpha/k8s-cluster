apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:latest@sha256:b75b5ae2fcb75948f468718ed4c0bd499a8cafc9daf7f90f4c1e0e5a6acf9df8  # Pin with digest — Renovate will manage this
          ports:
            - name: http
              containerPort: 8080
          env:
            # DOCKER_ENABLE_SECURITY was deprecated in v0.44 — use SECURITY_ENABLE_LOGIN instead.
            # Both are kept for compatibility during the Renovate-managed upgrade window.
            - name: DOCKER_ENABLE_SECURITY
              value: "false"
            - name: SECURITY_ENABLE_LOGIN
              value: "false"
            - name: INSTALL_BOOK_AND_ADVANCED_HTML_OPS
              value: "true"
            - name: LANGS
              value: "en_GB"
            # PostgreSQL configuration
            - name: SYSTEM_DATASOURCE_ENABLECUSTOMDATABASE
              value: "true"
            - name: SYSTEM_DATASOURCE_CUSTOMDATABACKENDURL
              value: "jdbc:postgresql://postgres-shared-pooler.database.svc:5432/stirling"
            - name: SYSTEM_DATASOURCE_USERNAME
              value: "stirling"
            - name: SYSTEM_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stirling-db-credentials
                  key: password
          volumeMounts:
            - name: data
              mountPath: /configs
              subPath: configs
            - name: data
              mountPath: /customFiles
              subPath: customFiles
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stirling-pdf-data-local
