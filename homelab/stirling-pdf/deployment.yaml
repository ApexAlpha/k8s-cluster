apiVersion: apps/v1
kind: Deployment
metadata:
  name: stirling-pdf
  namespace: stirling-pdf
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: stirling-pdf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stirling-pdf
  strategy:
    type: Recreate   # Required for RWO PVCs — prevents two pods binding the same volume
  template:
    metadata:
      labels:
        app: stirling-pdf
    spec:
      containers:
        - name: stirling-pdf
          image: stirlingtools/stirling-pdf:latest@sha256:9e5cdc1eb8c06f4f704655fa093effe659f342000c7b9cdb30ca4b408f2bda71  # Pin with digest — Renovate will manage this
          ports:
            - name: http
              containerPort: 8080
          env:
            # DOCKER_ENABLE_SECURITY was deprecated in v0.44 — use SECURITY_ENABLE_LOGIN instead.
            # Both are kept for compatibility during the Renovate-managed upgrade window.
            - name: DOCKER_ENABLE_SECURITY
              value: "false"
            - name: SECURITY_ENABLE_LOGIN
              value: "false"
            - name: INSTALL_BOOK_AND_ADVANCED_HTML_OPS
              value: "true"
            - name: LANGS
              value: "en_GB"
          volumeMounts:
            - name: configs
              mountPath: /configs        # settings.yml + user/auth database
            - name: custom
              mountPath: /customFiles    # branding, CSS, JS overrides
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/info/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: configs
          persistentVolumeClaim:
            claimName: stirling-pdf-configs
        - name: custom
          persistentVolumeClaim:
            claimName: stirling-pdf-custom
