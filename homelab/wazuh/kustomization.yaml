apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wazuh

configMapGenerator:
  - name: indexer-conf
    files:
      - conf/opensearch.yml
      - conf/internal_users.yml
  - name: wazuh-conf
    files:
      - conf/master.conf
      - conf/worker.conf
  - name: dashboard-conf
    files:
      - conf/opensearch_dashboards.yml

resources:
  - namespace.yaml
  - servers-transport.yaml
  - ingressroute.yaml

  # indexer (wave 1) -> manager master (wave 2) -> worker (wave 3) -> dashboard (wave 4)
  - indexer-svc.yaml
  - indexer-api-svc.yaml
  - indexer-sts.yaml

  - wazuh-cluster-svc.yaml
  - wazuh-master-svc.yaml
  - wazuh-master-sts.yaml

  - wazuh-workers-svc.yaml
  - wazuh-worker-sts.yaml

  - dashboard-svc.yaml
  - dashboard-deploy.yaml

  # credentials + certificate bundles (SealedSecrets; plaintext never committed)
  - sealed/indexer-cred.yaml
  - sealed/dashboard-cred.yaml
  - sealed/wazuh-api-cred.yaml
  - sealed/wazuh-authd-pass.yaml
  - sealed/wazuh-cluster-key.yaml
  - sealed/indexer-certs.yaml
  - sealed/dashboard-certs.yaml
  - sealed/manager-certs.yaml
  - sealed/wazuh-traefik-ca.yaml

# Pin the StatefulSet fields the API server defaults on every create/update.
#
# ArgoCD prunes server-side defaults using the OpenAPI schema, but
# persistentVolumeClaimRetentionPolicy has no schema default (the API sets
# Retain/Retain in a defaulting function), so it can never be pruned and the
# three StatefulSets showed as permanently OutOfSync. Declaring them makes the
# live object match the manifest field for field. Retain is also the intent
# here: pruning pods must not delete the indexer's and managers' data volumes.
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/persistentVolumeClaimRetentionPolicy
        value:
          whenDeleted: Retain
          whenScaled: Retain
      - op: add
        path: /spec/podManagementPolicy
        value: OrderedReady
      - op: add
        path: /spec/revisionHistoryLimit
        value: 10
      - op: add
        path: /spec/updateStrategy
        value:
          type: RollingUpdate
          rollingUpdate:
            partition: 0

