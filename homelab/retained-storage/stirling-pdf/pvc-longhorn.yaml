apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stirling-pdf-data-longhorn
  namespace: stirling-pdf
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
