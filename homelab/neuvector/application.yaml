apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: neuvector
  namespace: argocd
  annotations:
    # Security wave, next to falco. The chart self-registers no admission
    # webhook at install time, so it can come up alongside the app stacks.
    argocd.argoproj.io/sync-wave: "21"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://neuvector.github.io/neuvector-helm
    chart: core
    targetRevision: 2.11.2
    helm:
      releaseName: neuvector
      valuesObject:
        registry: docker.io
        tag: 5.6.2

        # Creates the shared ServersTransport and annotates the backend
        # services for HTTPS, instead of hand-writing those like the raw
        # stacks do. The annotation resolves cross-namespace as
        # <namespace>-<name>@kubernetescrd, which points back at the object
        # the chart creates in this same namespace.
        ingressController: traefik

        # Do NOT let the chart generate the controller/manager SSL cert.
        # controller-secret.yaml calls genSelfSignedCert on every render and the
        # pod template carries a sha256 of that file (checksum/controller-secret).
        # ArgoCD re-renders on every sync, so the hash changes -> new ReplicaSet
        # -> a rolling restart each time, and the internal-cert-upgrader never
        # sees a settled rollout (it waits for controller-pod to finish rolling).
        # The certs come from the sealed secrets in this directory instead, and
        # their keys (tls.pem/tls.key) match the pemFile/keyFile defaults.
        autoGenerateCert: false

        # k3s keeps containerd at a non-default socket path. Since 5.3 the
        # enforcer auto-detects the runtime, but only at the default location.
        runtimePath: /run/k3s/containerd/containerd.sock

        # One controller for an eval. The PVC is NOT really optional: users,
        # policy and the CVE database live in the controller's internal store,
        # so without it a controller restart resets the admin password. The
        # chart default access mode is ReadWriteMany, which local-path cannot
        # serve, hence the explicit ReadWriteOnce.
        controller:
          replicas: 1
          certificate:
            secret: neuvector-controller-secret
          nodeSelector:
            kubernetes.io/hostname: k3s-home-2
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          pvc:
            enabled: true
            storageClass: local-path
            accessModes:
              - ReadWriteOnce
            capacity: 1Gi

        # DaemonSet across every node, including the control-plane taints.
        enforcer:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi

        manager:
          certificate:
            secret: neuvector-manager-secret
          nodeSelector:
            kubernetes.io/hostname: k3s-home-2
          # The manager is a JVM app (Pekko). The chart's 512Mi limit OOMKills it
          # roughly 20s after start (exit 137) before it can bind 8443.
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          probes:
            enabled: true
          ingress:
            enabled: true
            host: neuvector.k8s.hu.ls
            ingressClassName: traefik
            path: /
            tls: true
            secretName: wildcard-k8s-hu-ls-tls
            annotations:
              # Same Authentik forwardAuth gate as every other user-facing app.
              traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd

        cve:
          scanner:
            # Upstream defaults to 3; one is plenty for an eval.
            replicas: 1
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi

        updater:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

        certupgrader:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: neuvector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
