apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - nfs.yaml
  - storageclass.yaml
  - plex.yaml
  - transmission.yaml
  - qbittorrent.yaml
  - prowlarr.yaml
  - sonarr.yaml
  - sonarr-4k.yaml
  - radarr.yaml
  - radarr-4k.yaml
  - bazarr.yaml
  - profilarr-v2.yaml
  - exportarr.yaml
  - exportarr-api-keys-sealed.yaml
  - bazarr-db-credentials-sealed.yaml
  - prowlarr-db-credentials-sealed.yaml
  - radarr-4k-db-credentials-sealed.yaml
  - radarr-db-credentials-sealed.yaml
  - sonarr-4k-db-credentials-sealed.yaml
  - sonarr-db-credentials-sealed.yaml
  - longhorn-claims.yaml

patches:
  - path: patches/security-exportarr-sonarr.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: exportarr-sonarr
  - path: patches/security-exportarr-sonarr-4k.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: exportarr-sonarr-4k
  - path: patches/security-exportarr-radarr.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: exportarr-radarr
  - path: patches/security-exportarr-radarr-4k.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: exportarr-radarr-4k
  - path: patches/security-exportarr-prowlarr.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: exportarr-prowlarr
  - path: patches/security-exportarr-bazarr.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: exportarr-bazarr
  - path: patches/security-profilarr-parser.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: profilarr-v2

  - path: patches/security-prowlarr.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: prowlarr

  - path: patches/security-bazarr.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: bazarr

  - path: patches/security-sonarr.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: sonarr

  - path: patches/security-sonarr-4k.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: sonarr-4k

  - path: patches/security-radarr.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: radarr

  - path: patches/security-radarr-4k.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: radarr-4k

  - path: patches/security-qbittorrent.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: qbittorrent

  - path: patches/security-transmission.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: transmission

  - path: patches/security-plex.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: plex
