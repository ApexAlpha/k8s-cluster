---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: profilarr-v2-config-local
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilarr-v2
  namespace: media
  labels:
    app: profilarr-v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: profilarr-v2
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: profilarr-v2
    spec:
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: profilarr
          image: ghcr.io/dictionarry-hub/profilarr:2.0.9@sha256:7a9b5112ff227320d17c65ab643a5d875713e6235991ef04a8e482ec51427902
          ports:
            - name: http
              containerPort: 6868
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: ORIGIN
              value: "https://profilarr.k8s.hu.ls"
            - name: PARSER_HOST
              value: "localhost"
            - name: PARSER_PORT
              value: "5000"
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
        - name: parser
          image: ghcr.io/dictionarry-hub/profilarr-parser:latest@sha256:16b22ef6485e135cc660cd511697c637d44649753d02397c9374e1317cfaaf0e
          ports:
            - name: parser
              containerPort: 5000
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: 5000
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 5000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: profilarr-v2-config-local
---
apiVersion: v1
kind: Service
metadata:
  name: profilarr-v2
  namespace: media
spec:
  selector:
    app: profilarr-v2
  ports:
    - name: http
      port: 80
      targetPort: 6868
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: profilarr-v2
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - profilarr.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: profilarr.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: profilarr-v2
                port:
                  number: 80