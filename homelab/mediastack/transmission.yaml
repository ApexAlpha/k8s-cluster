---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: juicefs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transmission-scripts
  namespace: media
data:
  unrar-done.sh: |
    #!/bin/sh
    # Called by Transmission with:
    #   TR_TORRENT_DIR  - download directory
    #   TR_TORRENT_NAME - torrent name
    DOWNLOAD_DIR="${TR_TORRENT_DIR}/${TR_TORRENT_NAME}"

    # Handle both single-file and directory torrents
    if [ -d "$DOWNLOAD_DIR" ]; then
      SEARCH_DIR="$DOWNLOAD_DIR"
    else
      SEARCH_DIR="$TR_TORRENT_DIR"
    fi

    # Find and extract any .rar files (handles multi-part too)
    find "$SEARCH_DIR" -name "*.rar" | while read rarfile; do
      # Skip numbered parts (part02.rar, etc.) - only process part01 or plain .rar
      case "$rarfile" in
        *.part[0-9]*.rar)
          echo "$rarfile" | grep -qE "\.part0*1\.rar$" || continue
          ;;
      esac
      echo "[unrar] Extracting: $rarfile to $SEARCH_DIR"
      unrar x -o+ -y "$rarfile" "$SEARCH_DIR"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: media
  labels:
    app: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: transmission
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-home  # Same location as NFS server
      initContainers:            # <-- add here
        - name: configure-script
          image: busybox@sha256:1487d0af5f52b4ba31c7e465126ee2123fe3f2305d638e7827681e7cf6c83d5e
          command:
            - sh
            - -c
            - |
              SETTINGS=/config/settings.json
              if [ -f "$SETTINGS" ]; then
                sed -i 's|"script-torrent-done-enabled":.*|"script-torrent-done-enabled": true,|' "$SETTINGS"
                sed -i 's|"script-torrent-done-filename":.*|"script-torrent-done-filename": "/scripts/unrar-done.sh",|' "$SETTINGS"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
      containers:
        - name: transmission
          image: lscr.io/linuxserver/transmission:latest@sha256:9be45020def7c121267d0c08ee7dfdcb39a07432699b347780f8acfb465951b5
          ports:
            - name: http
              containerPort: 9091
            - name: peer-tcp
              containerPort: 51413
              protocol: TCP
            - name: peer-udp
              containerPort: 51413
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /transmission/web/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /transmission/web/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: transmission-config
        - name: media
          persistentVolumeClaim:
            claimName: media-data
        - name: scripts
          configMap:
            name: transmission-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  namespace: media
spec:
  selector:
    app: transmission
  ports:
    - name: http
      port: 80
      targetPort: 9091
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transmission
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - transmission.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: transmission.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transmission
                port:
                  number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: transmission-peer
  namespace: media
spec:
  type: NodePort
  selector:
    app: transmission
  ports:
    - name: peer-tcp
      port: 51413
      targetPort: 51413
      nodePort: 51413
      protocol: TCP
    - name: peer-udp
      port: 51413
      targetPort: 51413
      nodePort: 51413
      protocol: UDP
