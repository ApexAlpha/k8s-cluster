---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: transmission-config-local
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transmission-scripts
  namespace: media
data:
  unrar-done.sh: |
    #!/bin/sh
    # Called by Transmission with:
    #   TR_TORRENT_DIR  - download directory
    #   TR_TORRENT_NAME - torrent name
    DOWNLOAD_DIR="${TR_TORRENT_DIR}/${TR_TORRENT_NAME}"

    # Handle both single-file and directory torrents
    if [ -d "$DOWNLOAD_DIR" ]; then
      SEARCH_DIR="$DOWNLOAD_DIR"
    else
      SEARCH_DIR="$TR_TORRENT_DIR"
    fi

    # Find and extract any .rar files (handles multi-part too)
    find "$SEARCH_DIR" -name "*.rar" | while read rarfile; do
      # Skip numbered parts (part02.rar, etc.) - only process part01 or plain .rar
      case "$rarfile" in
        *.part[0-9]*.rar)
          echo "$rarfile" | grep -qE "\.part0*1\.rar$" || continue
          ;;
      esac
      echo "[unrar] Extracting: $rarfile to $SEARCH_DIR"
      unrar x -o+ -y "$rarfile" "$SEARCH_DIR"
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: media
  labels:
    app: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: transmission
      annotations:
        backup.velero.io/backup-volumes-excludes: media
    spec:
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      initContainers:            # <-- add here
        - name: configure-script
          image: busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
          command:
            - sh
            - -c
            - |
              SETTINGS=/config/settings.json
              if [ -f "$SETTINGS" ]; then
                sed -i 's|"script-torrent-done-enabled":.*|"script-torrent-done-enabled": true,|' "$SETTINGS"
                sed -i 's|"script-torrent-done-filename":.*|"script-torrent-done-filename": "/scripts/unrar-done.sh",|' "$SETTINGS"
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
      containers:
        - name: transmission
          image: lscr.io/linuxserver/transmission:latest@sha256:81787bc706d3833d252e6d8b94545fea46bf2156f616320991a395619a477d2c
          ports:
            - name: http
              containerPort: 9091
            - name: peer-tcp
              containerPort: 51413
              hostPort: 51413
              protocol: TCP
            - name: peer-udp
              containerPort: 51413
              hostPort: 51413
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: PEERPORT
              value: "51413"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /transmission/web/
              port: http
            failureThreshold: 30
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /transmission/web/
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /transmission/web/
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 10
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: transmission-config-local
        - name: media
          persistentVolumeClaim:
            claimName: media-data
        - name: scripts
          configMap:
            name: transmission-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  namespace: media
spec:
  selector:
    app: transmission
  ports:
    - name: http
      port: 80
      targetPort: 9091
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: transmission
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: "nc-maintenance-maintenance-errors@kubernetescrd,authentik-authentik@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - transmission.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: transmission.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: transmission
                port:
                  number: 80
