---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-4k-config-local
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr-4k
  namespace: media
  labels:
    app: radarr-4k
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr-4k
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: radarr-4k
      annotations:
        backup.velero.io/backup-volumes-excludes: media
    spec:
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest@sha256:a45b5ab0f850f39edb4cc9c95bbd967b52ddc3d4574a4dfb45561177db6c88f4
          ports:
            - name: http
              containerPort: 7878
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
            # External auth — trust Authelia's Remote-User header, skip Radarr's own login
            - name: RADARR__AUTH__METHOD
              value: "External"
            - name: RADARR__AUTH__REQUIRED
              value: "DisabledForLocalAddresses"
            # PostgreSQL configuration
            - name: RADARR__POSTGRES__HOST
              value: "postgres-shared-pooler.database.svc"
            - name: RADARR__POSTGRES__PORT
              value: "5432"
            - name: RADARR__POSTGRES__USER
              value: "radarr4k_user"
            - name: RADARR__POSTGRES__PASSWORD
              valueFrom:
                secretKeyRef:
                  name: radarr-4k-db-credentials
                  key: password
            - name: RADARR__POSTGRES__MAINDB
              value: "radarr4k-main"
            - name: RADARR__POSTGRES__LOGDB
              value: "radarr4k-log"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-4k-config-local
        - name: media
          persistentVolumeClaim:
            claimName: media-data
---
apiVersion: v1
kind: Service
metadata:
  name: radarr-4k
  namespace: media
spec:
  selector:
    app: radarr-4k
  ports:
    - name: http
      port: 80
      targetPort: 7878
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: radarr-4k
  namespace: media
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`radarr-4k.k8s.hu.ls`) && PathPrefix(`/api`)
      kind: Rule
      priority: 20
      middlewares:
        - name: maintenance-errors
          namespace: nc-maintenance
      services:
        - name: radarr-4k
          port: 80
    - match: Host(`radarr-4k.k8s.hu.ls`)
      kind: Rule
      priority: 10
      middlewares:
        - name: maintenance-errors
          namespace: nc-maintenance
        - name: authentik
          namespace: authentik
      services:
        - name: radarr-4k
          port: 80
  tls:
    secretName: wildcard-k8s-hu-ls-tls
