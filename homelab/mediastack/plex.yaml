---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: plex-config
  namespace: media
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: media
  labels:
    app: plex
spec:
  replicas: 1
  selector:
    matchLabels:
      app: plex
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: plex
      annotations:
        backup.velero.io/backup-volumes-excludes: media
    spec:
      # Pin to NUC — Intel QuickSync is on this node
      # Verify hostname with: kubectl get nodes --show-labels
      nodeSelector:
        kubernetes.io/hostname: k3s-nuc

      # Host networking gives Plex direct access to the LAN, which is required
      # for GDM multicast discovery to work (UDP 32410-32414).
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet

      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30

      securityContext:
        # video (44) and render (993) groups — verified on k3s-nuc
        supplementalGroups: [44, 993]

      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:latest@sha256:8b2996bf9a78615d7490d30241ea75f86c3dcdaf14edb4c329eb912932537e4f
          imagePullPolicy: IfNotPresent
          ports:
            - name: plex
              containerPort: 32400
              hostPort: 32400
              protocol: TCP
            # GDM discovery — required for Plex server to see clients (e.g. Shield)
            # on the LAN. Multicast UDP won't cross the k8s network boundary without these.
            - name: gdm1
              containerPort: 32410
              hostPort: 32410
              protocol: UDP
            - name: gdm2
              containerPort: 32412
              hostPort: 32412
              protocol: UDP
            - name: gdm3
              containerPort: 32413
              hostPort: 32413
              protocol: UDP
            - name: gdm4
              containerPort: 32414
              hostPort: 32414
              protocol: UDP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: VERSION
              value: "docker"
            # Advertise the NUC's LAN IP so clients on the network can find it
            - name: ADVERTISE_IP
              value: "http://192.168.1.230:32400"
            - name: PLEX_CLAIM
              value: "claim-REPLACEME"

          volumeMounts:
            - name: config
              mountPath: /config
            - name: transcode
              mountPath: /transcode
            - name: media
              mountPath: /data
              readOnly: true
            - name: quicksync
              mountPath: /dev/dri

          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi

          livenessProbe:
            httpGet:
              path: /identity
              port: plex
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /identity
              port: plex
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config
        - name: transcode
          emptyDir: {}
        - name: media
          persistentVolumeClaim:
            claimName: media-data
        - name: quicksync
          hostPath:
            path: /dev/dri
---
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: media
spec:
  selector:
    app: plex
  ports:
    - name: plex
      port: 32400
      targetPort: 32400
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: plex
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - plex.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: plex.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: plex
                port:
                  number: 32400
