# Exportarr — Prometheus exporter for *arr apps
# API keys secret must be created manually:
#   kubectl create secret generic exportarr-api-keys -n media \
#     --from-literal=sonarr=<key> \
#     --from-literal=sonarr-4k=<key> \
#     --from-literal=radarr=<key> \
#     --from-literal=radarr-4k=<key> \
#     --from-literal=prowlarr=<key> \
#     --from-literal=bazarr=<key>
#   kubeseal --kubeconfig /etc/rancher/k3s/k3s.yaml --format yaml \
#     < exportarr-api-keys.yaml > exportarr-api-keys-sealed.yaml
---
# sonarr exporter
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exportarr-sonarr
  namespace: media
  labels:
    app: exportarr-sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exportarr-sonarr
  template:
    metadata:
      labels:
        app: exportarr-sonarr
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: exportarr
          image: ghcr.io/onedr0p/exportarr:v2@sha256:af535d94061cf97a52e1661945ffba78c03f9443eae7c0da1a80a5a4be56b520
          args: ["sonarr"]
          env:
            - name: PORT
              value: "9707"
            - name: URL
              value: "http://sonarr.media.svc"
            - name: APIKEY
              valueFrom:
                secretKeyRef:
                  name: exportarr-api-keys
                  key: sonarr
          ports:
            - name: metrics
              containerPort: 9707
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: exportarr-sonarr
  namespace: media
  labels:
    app: exportarr-sonarr
    monitoring: exportarr
spec:
  selector:
    app: exportarr-sonarr
  ports:
    - name: metrics
      port: 9707
      targetPort: metrics
---
