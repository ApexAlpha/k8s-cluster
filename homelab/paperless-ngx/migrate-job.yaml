apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-config
  namespace: paperless
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox@sha256:1487d0af5f52b4ba31c7e465126ee2123fe3f2305d638e7827681e7cf6c83d5e
          command:
            - sh
            - -c
            - |
              set -e
              echo "==> paperless-storage"
              cp -av /old/. /new/
              echo "==> Done"
          volumeMounts:
            - name: old
              mountPath: /old
            - name: new
              mountPath: /new
      volumes:
        - name: old
          persistentVolumeClaim:
            claimName: paperless-storage
        - name: new
          persistentVolumeClaim:
            claimName: paperless-storage-local
