apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - pvc.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - paperless-db-sealed.yaml
  - paperless-secret-sealed.yaml

patches:
  - path: patches/security-paperless.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: paperless
  - path: patches/security-paperless-redis.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: paperless-redis
