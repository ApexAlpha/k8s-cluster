apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-storage-local
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 80Gi

---
# Longhorn migration target; populated before the workload is cut over.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-storage-longhorn
  namespace: paperless
  annotations:
    argocd.argoproj.io/sync-options: SkipHealthCheck=true
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 80Gi
