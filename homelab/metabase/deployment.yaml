apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: metabase
  annotations:
    argocd.argoproj.io/sync-wave: "20"
  labels:
    app: metabase
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metabase
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: metabase
    spec:
      volumes:
        - name: metabase-runtime
          emptyDir: {}
        - name: duckdb-data
          persistentVolumeClaim:
            claimName: metabase-duckdb
            readOnly: true
      tolerations:
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      initContainers:
        - name: install-metabase-duckdb-driver
          image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              apk add --no-cache ca-certificates wget
              mkdir -p /opt/metabase/plugins
              wget -qO /opt/metabase/metabase.jar https://downloads.metabase.com/v0.59.28/metabase.jar
              echo "70e167d33fbffc87d07673dc5a8b32137f4cf513a68d5f4979e016609e709017  /opt/metabase/metabase.jar" | sha256sum -c -
              wget -qO /opt/metabase/plugins/duckdb.metabase-driver.jar https://github.com/MotherDuck-Open-Source/metabase_duckdb_driver/releases/download/1.5.5.0/duckdb.metabase-driver.jar
              echo "47a0d41ca52ff82a6ce78b0c52b2bdb58b32094405e446734cefc44eb1ddbd07  /opt/metabase/plugins/duckdb.metabase-driver.jar" | sha256sum -c -
          volumeMounts:
            - name: metabase-runtime
              mountPath: /opt/metabase
      containers:
        - name: metabase
          image: eclipse-temurin:25-jre-jammy@sha256:5bd5dbe00f40ea149de434a75029713765a2912cfc1fd770cc7c7aff007384ea
          imagePullPolicy: IfNotPresent
          command: ["java", "-jar", "/opt/metabase/metabase.jar"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: MB_DB_TYPE
              value: postgres
            - name: MB_DB_DBNAME
              value: metabase
            - name: MB_DB_PORT
              value: "5432"
            - name: MB_DB_HOST
              value: postgres-shared-rw.database.svc.cluster.local
            - name: MB_DB_USER
              value: metabase_user
            - name: MB_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: metabase-db-credentials
                  key: password
            - name: MB_JETTY_PORT
              value: "3000"
            - name: MB_PLUGINS_DIR
              value: /opt/metabase/plugins
            - name: JAVA_TIMEZONE
              value: Europe/Amsterdam
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: metabase-runtime
              mountPath: /opt/metabase
            - name: duckdb-data
              mountPath: /data
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
