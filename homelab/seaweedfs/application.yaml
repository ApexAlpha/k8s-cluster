apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "15"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://seaweedfs.github.io/seaweedfs/helm
    chart: seaweedfs
    targetRevision: 4.0.407
    helm:
      valuesObject:
        global:
          # Geo-distributed replication: 1 copy in different datacenter
          replicationPlacment: "100"
          enableReplication: true
            
        master:
          enabled: true
          replicas: 3
          port: 9333
          grpcPort: 19333
          
          # Datacenter awareness for masters
          extraEnvironmentVars:
            NODE_NAME:
              fieldRef:
                fieldPath: spec.nodeName
          
          # Longer timeouts for geo-distributed Raft
          config: |
            [master.maintenance]
            scripts = """
            """
            sleep_minutes = 17
            
            [master.raft]
            grpc_timeout_seconds = 30
            election_timeout_ms = 10000
            heartbeat_interval_ms = 2000
          
          # Small persistent storage for master metadata
          data:
            type: "persistentVolumeClaim"
            size: "1Gi"
            storageClass: "local-path"
          
          # Spread across zones - must be string format
          affinity: |
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: master
                  topologyKey: topology.kubernetes.io/zone
        
        volume:
          enabled: true
          replicas: 3
          port: 8080
          grpcPort: 18080
          
          # Datacenter awareness - use node name as datacenter
          # This makes each node its own DC for geo-distribution
          extraEnvironmentVars:
            NODE_NAME:
              fieldRef:
                fieldPath: spec.nodeName
          
          # Pass datacenter to volume server
          # $(NODE_NAME) gets expanded by Kubernetes
          dataCenter: "$(NODE_NAME)"
          rack: "rack1"
          
          # Only run on nodes with storage label - must be string format
          nodeSelector: |
            seaweedfs.io/volume: "true"
          
          # Spread across zones - must be string format
          affinity: |
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: volume
                  topologyKey: topology.kubernetes.io/zone
          
          # Use hostPath for volume data
          dataDirs:
            - name: data
              type: "hostPath"
              hostPathPrefix: /var/lib/seaweedfs
              maxVolumes: 0  # Auto-detect based on disk
        
        filer:
          enabled: true
          replicas: 3
          port: 8888
          grpcPort: 18888
          
          # Disable default leveldb - we use PostgreSQL
          filerGroup: ""
          defaultStoreDir: ""
          
          # Override chart's default extraEnvironmentVars completely
          # The chart defaults to WEED_LEVELDB2_ENABLED=true, we must override
          extraEnvironmentVars:
            WEED_MYSQL_ENABLED: "false"
            WEED_LEVELDB2_ENABLED: "false"
            WEED_POSTGRES_ENABLED: "true"
            WEED_POSTGRES_HOSTNAME: "postgres-shared-rw.database.svc"
            WEED_POSTGRES_PORT: "5432"
            WEED_POSTGRES_DATABASE: "seaweedfs_filer"
            WEED_POSTGRES_USERNAME: "app"
            WEED_POSTGRES_SSLMODE: "disable"
            WEED_POSTGRES_CONNECTION_MAX_IDLE: "5"
            WEED_POSTGRES_CONNECTION_MAX_OPEN: "75"
            WEED_POSTGRES_CONNECTION_MAX_LIFETIME_SECONDS: "600"
            WEED_POSTGRES_CREATETABLE: "true"
          
          # Password from manually-created secret (not in git)
          # Create with: kubectl create secret generic seaweedfs-db-credentials -n seaweedfs --from-literal=password=<your-pg-password>
          secretExtraEnvironmentVars:
            WEED_POSTGRES_PASSWORD:
              secretKeyRef:
                name: seaweedfs-db-credentials
                key: password
          
          # Spread across zones - must be string format
          affinity: |
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/component: filer
                  topologyKey: topology.kubernetes.io/zone
          
          # Disable the default leveldb2 store - we're using postgres
          defaultLocalBucketVolumeCount: 0
          
          # Enable S3 API
          s3:
            enabled: true
            port: 8333
            enableAuth: true
            config: ""   # important: empty

        extraVolumes:
          - name: s3-config
            secret:
            secretName: seaweedfs-s3-config

        extraVolumeMounts:
          - name: s3-config
            mountPath: /etc/seaweedfs/s3.json
            subPath: s3.json

          
          # No PVC needed - postgres is our store
          data:
            type: "emptyDir"
        
        # We'll deploy CSI driver separately for more control
        csi:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
