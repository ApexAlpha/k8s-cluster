apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-frigate-media
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-frigate-media
  mountOptions:
    - nfsvers=4.1
    - hard
    - intr
    - rsize=1048576
    - wsize=1048576
    - noatime
  nfs:
    server: 192.168.1.192
    path: /mnt/HDD_ZFS/nas_backup/data/camera
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: frigate-media
  namespace: frigate
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-frigate-media
  resources:
    requests:
      storage: 1Ti
