apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  labels:
    app: frigate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-nuc
      # video (44) and render (993) group access for /dev/dri
      securityContext:
        supplementalGroups:
          - 44   # video
          - 993  # render
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      initContainers:
        - name: seed-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/config.yml ]; then
                cp /configmap/config.yml /config/config.yml
                echo "Seeded config.yml from ConfigMap"
              else
                echo "config.yml already exists, skipping seed"
              fi
          volumeMounts:
            - name: data
              mountPath: /config
            - name: config
              mountPath: /configmap/config.yml
              subPath: config.yml
      containers:
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:stable@sha256:1724960349dad0bd2ae8ec884171a6fd5755a4dc242a0e66cadbda9c0e85c99b
          ports:
            - name: http
              containerPort: 8971
            - name: rtsp
              containerPort: 8554
            - name: webrtc-tcp
              containerPort: 8555
              hostPort: 8555
              protocol: TCP
            - name: webrtc-udp
              containerPort: 8555
              hostPort: 8555
              protocol: UDP
          env:
            - name: TZ
              value: "Europe/Amsterdam"
          volumeMounts:
            - name: data
              mountPath: /config
            - name: media
              mountPath: /media
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: /tmp/cache
            - name: dri
              mountPath: /dev/dri
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: frigate-data
        - name: config
          configMap:
            name: frigate-config
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: cache
          emptyDir: {}
        - name: dri
          hostPath:
            path: /dev/dri
