apiVersion: apps/v1
kind: Deployment
metadata:
  name: frigate
  namespace: frigate
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  labels:
    app: frigate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frigate
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: frigate
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-nuc
      # video (44) and render (993) group access for /dev/dri
      securityContext:
        supplementalGroups:
          - 44   # video
          - 993  # render
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: frigate
          image: ghcr.io/blakeblackshear/frigate:stable
          ports:
            - name: http
              containerPort: 8971
            - name: api
              containerPort: 5000
            - name: rtsp
              containerPort: 8554
            - name: webrtc-tcp
              containerPort: 8555
              hostPort: 8555
              protocol: TCP
            - name: webrtc-udp
              containerPort: 8555
              hostPort: 8555
              protocol: UDP
          env:
            - name: TZ
              value: "Europe/Amsterdam"
          volumeMounts:
            - name: data
              mountPath: /config
            - name: config
              mountPath: /config/config.yml
              subPath: config.yml
            - name: media
              mountPath: /media
            - name: shm
              mountPath: /dev/shm
            - name: cache
              mountPath: /tmp/cache
            - name: dri
              mountPath: /dev/dri
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /api/version
              port: api
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/version
              port: api
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/version
              port: api
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: frigate-data
        - name: config
          configMap:
            name: frigate-config
        - name: media
          persistentVolumeClaim:
            claimName: frigate-media
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: cache
          emptyDir: {}
        - name: dri
          hostPath:
            path: /dev/dri
