apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frigate
  namespace: frigate
  annotations:
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: "nc-maintenance-maintenance-errors@kubernetescrd,authentik-authentik@kubernetescrd"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - frigate.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: frigate.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frigate
                port:
                  number: 80
