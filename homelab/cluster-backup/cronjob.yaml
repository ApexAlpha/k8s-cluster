apiVersion: batch/v1
kind: CronJob
metadata:
  name: garage-to-hetzner
  namespace: cluster-backup
spec:
  schedule: "40 23 * * *"
  timeZone: Europe/Amsterdam
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: rclone
              image: rclone/rclone:1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
              command:
                - /bin/sh
                - -ec
                - |
                  set -e
                  COMMON="--config /rclone/rclone.conf --retries 5 --low-level-retries 10 --timeout 60s --retries-sleep 15s --log-level INFO"

                  # Nightly: archive garage -> encrypted Hetzner (long-retention tier).
                  # rclone copy (NO delete) makes Hetzner ACCUMULATE history beyond the
                  # local 7d window — it is a retention archive, not a same-window mirror.
                  rclone copy garage:postgres-backups hcrypt-postgres: $COMMON --transfers 8 --checkers 16
                  rclone copy garage:velero-backups hcrypt-velero: $COMMON --transfers 8 --checkers 16

                  # Bounded retention on Hetzner: prune anything older than 60 days.
                  # Local keeps 7d; Hetzner keeps 60d; monthly snapshots keep forever.
                  # (60d is a TTL guard — old bases+WAL here become the long restore arc.)
                  rclone delete hcrypt-postgres: $COMMON --min-age 60d
                  rclone delete hcrypt-velero: $COMMON --min-age 60d

                  # Monthly snapshot on the 1st (poison-attack protection).
                  # Copied into a separate monthly/ prefix never touched by prune/delete.
                  if [ "$(date +%d)" = "01" ]; then
                    M=$(date +%Y-%m)
                    rclone copy hcrypt-postgres: hcrypt-postgres-monthly:$M/ $COMMON --transfers 8 --checkers 16
                    rclone copy hcrypt-velero: hcrypt-velero-monthly:$M/ $COMMON --transfers 8 --checkers 16
                  fi

                  echo "HETZNER_ENCRYPTED_ARCHIVE_OK"
              volumeMounts:
                - name: rclone-config
                  mountPath: /rclone
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: rclone-config
              secret:
                secretName: rclone-config
