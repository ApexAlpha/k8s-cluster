apiVersion: batch/v1
kind: CronJob
metadata:
  name: garage-to-hetzner
  namespace: cluster-backup
spec:
  schedule: "0 4 * * *"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: OnFailure
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: rclone
              image: rclone/rclone:1.75.0@sha256:b06aed988cf5967de7c25be5925240983981c757f4ed1ac9d2fa659d51d60548
              command:
                - /bin/sh
                - -ec
                - |
                  set -e
                  COMMON="--config /rclone/rclone.conf --retries 5 --low-level-retries 10 --timeout 60s --retries-sleep 15s --log-level INFO"

                  # Nightly: mirror garage -> encrypted Hetzner.
                  # rclone sync (with delete) keeps Hetzner exactly mirroring garage,
                  # so both hold the same 7-day window (velero TTL 7d / barman retention 7d).
                  rclone sync garage:postgres-backups hcrypt-postgres: $COMMON --transfers 8 --checkers 16
                  rclone sync garage:velero-backups hcrypt-velero: $COMMON --transfers 8 --checkers 16

                  # Monthly snapshot on the 1st (poison-attack protection).
                  # Copied into a separate monthly/ prefix never touched by the sync.
                  if [ "$(date +%d)" = "01" ]; then
                    M=$(date +%Y-%m)
                    rclone copy hcrypt-postgres: hcrypt-postgres-monthly:$M/ $COMMON --transfers 8 --checkers 16
                    rclone copy hcrypt-velero: hcrypt-velero-monthly:$M/ $COMMON --transfers 8 --checkers 16
                  fi

                  echo "HETZNER_ENCRYPTED_SYNC_OK"
              volumeMounts:
                - name: rclone-config
                  mountPath: /rclone
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
          volumes:
            - name: rclone-config
              secret:
                secretName: rclone-config
