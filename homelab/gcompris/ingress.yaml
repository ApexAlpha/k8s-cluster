apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gcompris
  namespace: gcompris
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-redirect-https@kubernetescrd
    # KASM backend is self-signed HTTPS on :6901
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: gcompris-gcompris-kasm-transport@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - lezen.k8s.hu.ls
      secretName: wildcard-k8s-hu-ls-tls
  rules:
    - host: lezen.k8s.hu.ls
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gcompris
                port:
                  number: 6901
