apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcompris
  namespace: gcompris
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: gcompris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcompris
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gcompris
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: gcompris
          # ── Build & push from homelab/gcompris/Dockerfile ─────────
          # docker build -t ghcr.io/apexalpha/gcompris-kasm:latest homelab/gcompris/
          # docker push ghcr.io/apexalpha/gcompris-kasm:latest
          image: ghcr.io/apexalpha/gcompris-kasm:latest
          imagePullPolicy: Always
          ports:
            - name: kasmvnc
              containerPort: 6901
              protocol: TCP
          env:
            - name: VNC_PW
              valueFrom:
                secretKeyRef:
                  name: gcompris-vnc
                  key: password
            - name: VNC_RESOLUTION
              value: "1920x1080"
            - name: LANG
              value: "nl_NL.UTF-8"
            - name: LC_ALL
              value: "nl_NL.UTF-8"
          volumeMounts:
            # Persist user profile (progress, settings)
            - name: profile
              mountPath: /home/kasm-user
            # KasmVNC needs adequate shared memory
            - name: dshm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: kasmvnc
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: kasmvnc
            initialDelaySeconds: 20
            periodSeconds: 30
      volumes:
        - name: profile
          persistentVolumeClaim:
            claimName: gcompris-profile
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
