apiVersion: batch/v1
kind: Job
metadata:
  name: lh-copy-mealie
  namespace: mealie
  annotations:
    argocd.argoproj.io/sync-wave: '999'
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 480
  template:
    metadata:
      labels:
        app: longhorn-data-copy
        migration-for: mealie
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-nuc
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: copy-and-verify
        image: docker.io/library/python:3.12-slim@sha256:b18b261e1b4974b4f321451ad5251ded85abb22c2b8b262da527dda1d031ab30
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/python3
        - -c
        - "import collections,hashlib,json,os,stat,subprocess\nfrom pathlib import\
          \ Path\nsource=Path('/source');target=Path('/target')\nassert not [p for\
          \ p in target.iterdir() if p.name!='lost+found'], 'Target must be empty'\n\
          def fail(e):raise e\ndef manifest(root):\n result={}\n for parent,dirs,files\
          \ in os.walk(root,followlinks=False,onerror=fail):\n  if Path(parent)==root:dirs[:]=[d\
          \ for d in dirs if d!='lost+found']\n  dirs.sort();files.sort()\n  for name\
          \ in dirs+files:\n   p=Path(parent)/name;s=p.lstat();item={'mode':stat.S_IMODE(s.st_mode),'uid':s.st_uid,'gid':s.st_gid,'mtime_ns':s.st_mtime_ns}\n\
          \   if stat.S_ISREG(s.st_mode):\n    h=hashlib.sha256()\n    with p.open('rb')\
          \ as f:\n     for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)\n\
          \    item.update(type='file',size=s.st_size,sha256=h.hexdigest())\n   elif\
          \ stat.S_ISDIR(s.st_mode):item['type']='directory'\n   elif stat.S_ISLNK(s.st_mode):item.update(type='symlink',target=os.readlink(p))\n\
          \   else:raise RuntimeError('Unsupported special file; no copy performed')\n\
          \   result[str(p.relative_to(root))]=item\n return result\nbefore=manifest(source)\n\
          subprocess.run(['cp','-a','/source/.','/target/'],check=True)\nsubprocess.run(['sync','-f','/target'],check=True)\n\
          after=manifest(target);assert before==manifest(source),'Source changed';assert\
          \ before==after,'Copy content/metadata mismatch'\nfor attr in ['st_uid','st_gid','st_mode']:assert\
          \ getattr(source.stat(),attr)==getattr(target.stat(),attr),'Root metadata\
          \ mismatch'\nsuffixes={s:sum(1 for p,v in before.items() if v['type']=='file'\
          \ and p.endswith(s)) for s in ['.torrent','.fastresume','.resume','.db','.sqlite','.sqlite3']}\n\
          print(json.dumps({'verified':True,'entries':len(before),'types':dict(collections.Counter(x['type']\
          \ for x in before.values())),'file_bytes':sum(x.get('size',0) for x in before.values()),'manifest_sha256':hashlib.sha256(json.dumps(before,sort_keys=True,separators=(',',':')).encode()).hexdigest(),'known_state_file_counts':suffixes,'checks':['content','ownership','mode','mtime','symlinks','source-stability']},sort_keys=True),flush=True)\n"
        env:
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - FSETID
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
        - name: target
          mountPath: /target
      volumes:
      - name: source
        persistentVolumeClaim:
          claimName: mealie-data-local
          readOnly: true
      - name: target
        persistentVolumeClaim:
          claimName: mealie-data-longhorn
