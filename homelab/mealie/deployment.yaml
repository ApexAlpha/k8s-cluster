apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mealie
    spec:
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:latest@sha256:d99fc2844c04288526d6cbecc9ac1b6c32d8ea6054236d56857107bbaf70ea5c
          ports:
            - name: http
              containerPort: 9000
          env:
            # General
            - name: ALLOW_SIGNUP
              value: "true"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: BASE_URL
              value: "https://recipes.k8s.hu.ls"

            # Database — shared CNPG cluster
            - name: DB_ENGINE
              value: "postgres"
            - name: POSTGRES_SERVER
              value: "postgres-shared-rw.database.svc"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "mealie"
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-db
                  key: password

          volumeMounts:
            - name: data
              mountPath: /app/data

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
