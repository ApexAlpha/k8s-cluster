apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: mealie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mealie
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: mealie
    spec:
      # Prefer running on the same node as PostgreSQL primary for lower latency
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    cnpg.io/cluster: postgres-shared
                    role: primary
                topologyKey: kubernetes.io/hostname
                namespaces:
                  - database
      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:latest@sha256:8d962f611390a1cca667eed32a29e9467e9c01c523e2db3ad00f667372067f9d
          ports:
            - name: http
              containerPort: 9000
          env:
            # General
            - name: ALLOW_SIGNUP
              value: "true"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: BASE_URL
              value: "https://recipes.k8s.hu.ls"

            # Database — shared CNPG cluster
            - name: DB_ENGINE
              value: "postgres"
            - name: POSTGRES_SERVER
              value: "postgres-shared-rw.database.svc"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "mealie"
            - name: POSTGRES_USER
              value: "app"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mealie-db
                  key: password

            # OIDC / Authelia
            - name: OIDC_AUTH_ENABLED
              value: "true"
            - name: OIDC_SIGNUP_ENABLED
              value: "true"
            - name: OIDC_CONFIGURATION_URL
              value: "https://auth.k8s.hu.ls/.well-known/openid-configuration"
            - name: OIDC_CLIENT_ID
              value: "mealie"
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mealie-oidc
                  key: client_secret
            - name: OIDC_AUTO_REDIRECT
              value: "false"

          volumeMounts:
            - name: data
              mountPath: /app/data

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data
