apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kured
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://kubereboot.github.io/charts
    chart: kured
    targetRevision: 5.6.0
    helm:
      valuesObject:
        configuration:
          # Time window for reboots (use your timezone)
          timeZone: "Europe/Amsterdam"
          startTime: "02:00"
          endTime: "06:00"
          
          # How often to check for reboot sentinel
          period: "1h"
          
          # Lock ensures only one node reboots at a time across the cluster
          lockTtl: "30m"
          lockReleaseDelay: "5m"
          
          # Drain settings - be generous for geo-distributed nodes
          drainGracePeriod: 300        # 5 min for pods to terminate
          drainTimeout: 600            # 10 min max drain time
          skipWaitForDeleteTimeout: 60 # Wait for pod deletion
          drainPodSelector: ""         # Drain all pods
          
          # What triggers a reboot
          rebootSentinelCommand: "test -f /var/run/reboot-required"
          
          # Concurrency - only 1 node at a time (critical for 3-node HA)
          concurrency: 1
          
          # Don't reboot if we can't drain cleanly
          forceReboot: false
          
          # Log to stdout for kubectl logs
          logFormat: "text"
          
          # Optional: Notify before reboot (uncomment and configure)
          # notifyUrl: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
          # messageTemplateDrain: "Draining node %s for reboot"
          # messageTemplateReboot: "Rebooting node %s"
          # messageTemplateUncordon: "Node %s back online"
        
        # Run on all nodes including control plane
        tolerations:
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
          - key: "node-role.kubernetes.io/master"
            operator: "Exists"
            effect: "NoSchedule"
        
        # Metrics for Prometheus (optional)
        metrics:
          create: false
        
        # Resource limits
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
  
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
