apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Operators - Wave 5
  - cnpg/operator.yaml
  - netbird-operator.yaml
  - kured/application.yaml
  
  # Databases - Wave 10 (after operators)
  - cnpg/cluster-app.yaml
  
  # Storage - Wave 14-17 (after databases)
  - seaweedfs/config-app.yaml      # Wave 14: namespace, secrets, storageclasses
  - seaweedfs/application.yaml      # Wave 15: main seaweedfs
  - seaweedfs/csi-application.yaml  # Wave 16: CSI driver
  
  #Ingress
  - traefik/application.yaml

  #CoreDNS
  - coredns/application.yaml

  # Apps - Wave 20+ (after storage)
  - vaultwarden/application.yaml
  - mediastack/application.yaml
  - paperless-ngx/application.yaml  
  - unifi/application.yaml
  - immich/application.yaml
  - nextcloud/application.yaml
  - homepage/application.yaml
  # - apps/plex.yaml
