apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Operators - Wave 5
  - cnpg/operator.yaml
  - netbird-operator.yaml
  - kured/application.yaml

  # Databases - Wave 10 (after operators)
  - cnpg/cluster-app.yaml
  
  # Storage - Wave 14-17 (after databases)
  - garage/application.yaml         # Wave 14: Garage namespace, services, ingress
  - juicefs/csi-application.yaml    # Wave 16: JuiceFS CSI driver (Helm)
  - juicefs/config-application.yaml # Wave 17: JuiceFS StorageClass
  
  #Ingress
  - traefik/

  #CoreDNS
  - coredns/application.yaml

  #Blocky
  - blocky/application.yaml

  - argocd/

  # Auth - Wave 15 (before apps)
  - authelia/application.yaml

  # Monitoring - Wave 20 (after storage)
  - monitoring/application.yaml

  # Apps - Wave 20+ (after storage)
  - vaultwarden/application.yaml
  - mediastack/application.yaml
  - paperless-ngx/application.yaml  
  - unifi/application.yaml
  - immich/application.yaml
  - stirling-pdf/application.yaml
  - it-tools/application.yaml
  - cyberchef/application.yaml
  - mealie/application.yaml
  - nextcloud/application.yaml
  - homepage/application.yaml

  # Admin - Wave 25
  - headlamp/application.yaml
