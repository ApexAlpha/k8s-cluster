apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Sealed Secrets - Wave 3 (early, needed by all apps)
  - sealed-secrets/application.yaml
  # GHCR pull secret propagation - Wave 3
  - ghcr-secret/

  # NetPols - Per-namespace network policies (P2.1)
  - netpols/


  # MetalLB - Wave 4-5 (L2 LoadBalancer for LAN)
  - metallb/

  # Cert-manager config + Reflector - Wave 3-5
  - cert-manager/application.yaml

  # Operators - Wave 5
  - cnpg/operator.yaml
  - velero/

  # Databases - Wave 10 (after operators)
  - cnpg/cluster-app.yaml

  # Storage - Wave 14-17 (after databases)
  - garage/application.yaml         # Wave 14: Garage namespace, services, ingress
  
  #Ingress
  - traefik/

  #CoreDNS
  - coredns/application.yaml

  #Blocky
  - blocky/application.yaml

  - argocd/

  # Auth - Wave 15 (before apps)
  - authentik/

  # Monitoring - Wave 20 (after storage)
  - monitoring/application.yaml

  # Security - Wave 21 (after monitoring stack is ready for falcosidekick → Loki)
  - falco/application.yaml

  # Apps - Wave 20+ (after storage)
  - vaultwarden/application.yaml
  - mediastack/application.yaml
  - paperless-ngx/application.yaml  
  - unifi-os/application.yaml
  - unifi/application.yaml
  - immich/application.yaml
  - stirling-pdf/application.yaml
  - metabase/application.yaml
  - it-tools/application.yaml
  - cyberchef/application.yaml
  - searxng/application.yaml
  - mealie/application.yaml
  - audiobookshelf/application.yaml
  - nc-maintenance/application.yaml
  - nextcloud/
  - frigate/application.yaml
  - collabora/application.yaml
  - home-assistant/application.yaml
  - wyoming/application.yaml
  - homepage/application.yaml

  # Public personal website (Jules Huls)
  - juleshuls/application.yaml

  # Backup - Wave 25 (after storage)
  - cluster-backup/application.yaml

  # k3s Automated Upgrades (system-upgrade-controller) - Wave 26
  - system-upgrade/application.yaml

  # kured (safe node reboots) - Wave 26
  - kured/application.yaml

  # Network
  - wireguard/application.yaml

  # Admin - Wave 25
  - headlamp/application.yaml
  - openclaw/application.yaml
  - k8s-mcp-server/application.yaml
  - radar/application.yaml
  - trawl/application.yaml
  - caretta/application.yaml
  - hermes/application.yaml
  # - apps/plex.yaml