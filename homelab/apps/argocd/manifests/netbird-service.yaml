apiVersion: v1
kind: Service
metadata:
  name: argocd-server-netbird
  namespace: argocd
  annotations:
    # Expose via Netbird operator
    netbird.io/expose: "true"
    # Group for access control in Netbird
    netbird.io/groups: "argocd-access"
    # Link to policy base defined in netbird-operator-config
    netbird.io/policy: "homelab-admins"
    # Custom resource name in Netbird dashboard
    netbird.io/resource-name: "argocd"
spec:
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    - name: https
      port: 443
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
