apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly
  namespace: firefly
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app: firefly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: firefly
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: firefly
    spec:
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: firefly
          image: fireflyiii/core:latest@sha256:783676cad3a9aed58539ae270d6849f15abefc4300175f1526b3f46b74ad96ce
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: "https://firefly.k8s.hu.ls"
            - name: TRUSTED_PROXIES
              value: "**"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: LOG_CHANNEL
              value: "stdout"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: firefly-secret
                  key: app_key

            # PostgreSQL - using CNPG shared cluster
            - name: DB_CONNECTION
              value: "pgsql"
            - name: DB_HOST
              value: "postgres-shared-pooler.database.svc"
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: "firefly"
            - name: DB_USERNAME
              value: "app"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-db
                  key: password

          volumeMounts:
            - name: uploads
              mountPath: /var/www/html/storage/upload

          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3

      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: firefly-uploads-local
