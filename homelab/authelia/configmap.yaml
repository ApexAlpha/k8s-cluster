apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: authelia
data:
  configuration.template.yml: |
    # Authelia configuration for 4.38+
    # Docs: https://www.authelia.com/configuration/

    theme: auto

    server:
      address: 'tcp://0.0.0.0:9091'

    log:
      level: info
      format: text

    telemetry:
      metrics:
        enabled: true
        address: 'tcp://0.0.0.0:9959'

    totp:
      issuer: k8s.hu.ls
      period: 30
      skew: 1

    webauthn:
      disable: false
      enable_passkey_login: true
      # Allows a Yubikey with PIN to satisfy both factors (password + 2FA) at once
      experimental_enable_passkey_uv_two_factors: true
      display_name: k8s.hu.ls
      attestation_conveyance_preference: indirect
      user_verification: required
      timeout: 60s

    identity_validation:
      reset_password:
        jwt_lifespan: 5m
        jwt_algorithm: HS256

    authentication_backend:
      file:
        path: /config/users_database.yml
        password:
          algorithm: argon2id
          iterations: 3
          memory: 65536
          parallelism: 4
          key_length: 32
          salt_length: 16

    access_control:
      default_policy: deny
      rules:
        - domain: auth.k8s.hu.ls
          policy: bypass
        - domain: recipes.k8s.hu.ls
          policy: bypass
        - domain: bazarr.k8s.hu.ls
          policy: two_factor
        - domain: "*.k8s.hu.ls"
          policy: two_factor

    session:
      cookies:
        - domain: k8s.hu.ls
          authelia_url: https://auth.k8s.hu.ls
          name: authelia_session
          same_site: lax
          expiration: 1h
          inactivity: 5m
          remember_me: 1M
      redis:
        host: auth-redis
        port: 6379

    regulation:
      max_retries: 3
      find_time: 2m
      ban_time: 5m

    storage:
      postgres:
        address: 'tcp://postgres-shared-rw.database.svc:5432'
        database: authelia
        username: authelia
        password: {{ secret "/secrets/db_password" | msquote }}

    notifier:
      filesystem:
        filename: /data/notification.txt

    identity_providers:
      oidc:
        jwks:
          - key_id: main
            algorithm: RS256
            key: {{ secret "/secrets/oidc_jwks_key" | mindent 10 "|" | msquote }}
        cors:
          endpoints:
            - authorization
            - token
            - revocation
            - introspection
          allowed_origins_from_client_redirect_uris: true
        clients:
          - client_id: immich
            client_name: Immich
            client_secret: '$pbkdf2-sha512$310000$3nJHyQ4uL6B1nClu9OV8gQ$gtbpamIVSrlD8tX2bcmHR3JSMnpVG8AVwn6ZK5GJY3qlcnWLJJhRgwTqTZCu2wuiP/Zb2Fqy8W2PEY2wKfRhuA'
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://photos.k8s.hu.ls/auth/login
              - app.immich:///oauth-callback
            scopes:
              - openid
              - profile
              - email
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic

          - client_id: audiobookshelf
            client_name: Audiobookshelf
            client_secret: '$pbkdf2-sha512$310000$jqsxbIce44meyVF3/96E4g$dN4ZJcbnrQ3q5uFCHz.DGa0LZhbSLmTEVgIjxqLkcRi1t9pY.xuheilLKLmYglevHUBZ8YU4edEAJagpGCC62w'
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://abs.k8s.hu.ls/auth/openid/callback
            scopes:
              - openid
              - profile
              - email
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_post

          - client_id: mealie
            client_name: Mealie
            client_secret: '$pbkdf2-sha512$310000$ZQGy.bEs8MOijC3BpD/H1A$NetXzVc0us/QQp7sDnwNlxjK3O/.UgPVrBJ0KbbtfRa9Ye7Ni0z.MKZ64Y8j3Mxgnx8H6HAjQ.N6HuExpeZOBw'
            public: false
            authorization_policy: one_factor
            redirect_uris:
              - https://recipes.k8s.hu.ls/login
              - https://recipes.k8s.hu.ls/login/
              - https://recipes.k8s.hu.ls/api/auth/callback/oidc
            scopes:
              - openid
              - profile
              - email
              - groups
            userinfo_signed_response_alg: none
            token_endpoint_auth_method: client_secret_basic
