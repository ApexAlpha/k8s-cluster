---
apiVersion: v1
kind: Namespace
metadata:
  name: unifi
---
# Service without selector — we provide our own Endpoints
apiVersion: v1
kind: Service
metadata:
  name: unifi-controller-legacy
  namespace: unifi
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: unifi-controller-legacy
  namespace: unifi
subsets:
  - addresses:
      - ip: 192.168.1.228
    ports:
      - name: https
        port: 8443
        protocol: TCP
---
# Tell Traefik to skip TLS verification on the self-signed Unifi backend
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi-transport
  namespace: unifi
spec:
  insecureSkipVerify: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-k8s-hu-ls
  namespace: unifi
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: wildcard-k8s-hu-ls-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - "*.k8s.hu.ls"
    - "k8s.hu.ls"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unifi
  namespace: unifi
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`unifi.k8s.hu.ls`)
      kind: Rule
      middlewares:
        - nc-maintenance-maintenance-errors@kubernetescrd
      services:
        - name: unifi-os-webui
          port: 443
          scheme: https
          serversTransport: unifi-transport
  tls:
    secretName: wildcard-k8s-hu-ls-tls
