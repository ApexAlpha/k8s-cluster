apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-mcp-reader
rules:
- apiGroups: [""]
  resources: [pods,pods/log,nodes,nodes/proxy,services,endpoints,persistentvolumes,persistentvolumeclaims,configmaps,secrets,events,namespaces,serviceaccounts,replicationcontrollers,resourcequotas,limitranges]
  verbs: [get,list,watch]
- apiGroups: [apps]
  resources: [deployments,statefulsets,daemonsets,replicasets,controllerrevisions]
  verbs: [get,list,watch]
- apiGroups: [batch]
  resources: [jobs,cronjobs]
  verbs: [get,list,watch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles,clusterrolebindings,roles,rolebindings]
  verbs: [get,list,watch]
- apiGroups: [networking.k8s.io]
  resources: [networkpolicies,ingresses]
  verbs: [get,list,watch]
- apiGroups: [storage.k8s.io]
  resources: [storageclasses,csidrivers,csinodes,volumeattachments]
  verbs: [get,list,watch]
- apiGroups: [autoscaling]
  resources: [horizontalpodautoscalers]
  verbs: [get,list,watch]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [get,list,watch]
- apiGroups: [argoproj.io]
  resources: [applications,appprojects]
  verbs: [get,list,watch]
- apiGroups: [cert-manager.io]
  resources: [certificates,issuers,clusterissuers]
  verbs: [get,list,watch]
- apiGroups: [monitoring.coreos.com]
  resources: [prometheuses,alertmanagers,servicemonitors,podmonitors]
  verbs: [get,list,watch]
- apiGroups: [postgresql.cnpg.io]
  resources: [clusters,backups]
  verbs: [get,list,watch]
- apiGroups: [falco.org]
  resources: [falcoapps]
  verbs: [get,list,watch]
- apiGroups: [metallb.io]
  resources: [ipaddresspools,l2advertisements,bgppeers]
  verbs: [get,list,watch]
