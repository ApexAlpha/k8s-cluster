apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp-server
  namespace: mcp
  labels:
    app: k8s-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp-server
  template:
    metadata:
      labels:
        app: k8s-mcp-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: k8s-mcp-reader
      volumes:
      - name: config
        configMap:
          name: k8s-mcp-server-config
      containers:
      - name: server
        image: ghcr.io/containers/kubernetes-mcp-server:latest@sha256:103b5ddf396ddb64b637dfed27e19d0e46d93c2062b60dda5e21acbb405c5a93
        imagePullPolicy: IfNotPresent
        args:
        - --config
        - /etc/kubernetes-mcp-server/config.toml
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/kubernetes-mcp-server/config.toml
          subPath: config.toml
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
