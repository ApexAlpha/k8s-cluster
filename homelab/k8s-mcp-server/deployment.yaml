apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp-server
  namespace: mcp
  labels:
    app: k8s-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp-server
  template:
    metadata:
      labels:
        app: k8s-mcp-server
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      serviceAccountName: k8s-mcp-reader
      containers:
      - name: server
        image: ghcr.io/containers/kubernetes-mcp-server:latest@sha256:b2d6d8541e41cfed633220d8cc0c9b40f5d5b109da4abc0a06e132dff7e65e93
        imagePullPolicy: IfNotPresent
        args:
        - --port
        - "8080"
        - --cluster-provider
        - in-cluster
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          periodSeconds: 10
