apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-mcp-server
  namespace: mcp
  labels:
    app: k8s-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-mcp-server
  template:
    metadata:
      labels:
        app: k8s-mcp-server
    spec:
      serviceAccountName: k8s-mcp-reader
      containers:
      - name: server
        image: ghcr.io/alexei-led/k8s-mcp-server:latest@sha256:bf181191c6ea6833784ca8443b49c00b90654ff192412ffed04fdc7022c089a0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: K8S_MCP_TRANSPORT
          value: streamable-http
        - name: K8S_MCP_TIMEOUT
          value: "600"
        - name: K8S_MCP_SECURITY_MODE
          value: "strict"
        - name: FORWARDED_ALLOW_IPS
          value: "*"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 15
        readinessProbe:
          tcpSocket:
            port: 8000
          periodSeconds: 10
