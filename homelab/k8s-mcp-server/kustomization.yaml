apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp

resources:
- namespace.yaml
- serviceaccount.yaml
- clusterrole.yaml
- clusterrolebinding.yaml
- deployment.yaml
- service.yaml
- middleware-basicauth.yaml
- middleware-rewrite-host.yaml
- ingressroute.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
- name: mcp-auth-secret
  namespace: mcp
  files:
  - users=secrets/users

commonLabels:
  app.kubernetes.io/name: k8s-mcp-server
  app.kubernetes.io/part-of: infrastructure
