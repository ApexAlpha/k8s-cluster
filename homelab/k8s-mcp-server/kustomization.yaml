apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mcp

resources:
- namespace.yaml
- serviceaccount.yaml
- clusterrole.yaml
- clusterrolebinding.yaml
- deployment.yaml
- service.yaml
- ingressroute.yaml

labels:
- pairs:
    app.kubernetes.io/name: k8s-mcp-server
    app.kubernetes.io/part-of: infrastructure
  includeSelectors: false
