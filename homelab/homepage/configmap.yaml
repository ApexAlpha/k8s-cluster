apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: homepage
data:
  settings.yaml: |
    title: Home
    favicon: https://cdn.jsdelivr.net/gh/walkxcode/dashboard-icons/png/homepage.png
    theme: dark
    color: stone
    headerStyle: clean
    layout:
      Documents & Security:
        icon: mdi-file-document
        style: row
        columns: 4
      Tools:
        icon: mdi-toolbox
        style: row
        columns: 3
      Media:
        icon: mdi-filmstrip
        style: row
        columns: 4
      Downloads:
        icon: mdi-download
        style: row
        columns: 4
      Network & Admin:
        icon: mdi-server
        style: row
        columns: 3

  services.yaml: |
    - Documents & Security:
        - Paperless:
            icon: paperless-ngx
            href: https://docs.k8s.hu.ls
            description: Document Management
        - Vaultwarden:
            icon: vaultwarden
            href: https://vault.k8s.hu.ls
            description: Password Manager
        - Immich:
            icon: immich
            href: https://photos.k8s.hu.ls
            description: Immich Photos
        - Nextcloud:
            icon: nextcloud
            href: https://office.k8s.hu.ls
            description: NextCloud Office Hub
        - Mealie:
            icon: mealie
            href: https://recipes.k8s.hu.ls
            description: Recipes & Meal Planning

    - Tools:
        - Stirling PDF:
            icon: stirling-pdf
            href: https://pdf.k8s.hu.ls
            description: PDF Tools
        - IT-Tools:
            icon: it-tools
            href: https://tools.k8s.hu.ls
            description: Developer Utilities
        - CyberChef:
            icon: cyberchef
            href: https://cyberchef.k8s.hu.ls
            description: Data Encoding & Analysis

    - Media:
        - Plex:
            icon: plex
            href: http://100.73.28.98:32400/web
            description: Stream Movies & TV
            widget:
              type: plex
              url: http://100.73.28.98:32400
              key: "{{HOMEPAGE_VAR_PLEX_KEY}}"
        - Sonarr:
            icon: sonarr
            href: https://sonarr.k8s.hu.ls
            description: TV Shows
            widget:
              type: sonarr
              url: http://sonarr.media.svc
              key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
        - Sonarr 4K:
            icon: sonarr
            href: https://sonarr-4k.k8s.hu.ls
            description: TV Shows (4K)
            widget:
              type: sonarr
              url: http://sonarr-4k.media.svc
              key: "{{HOMEPAGE_VAR_SONARR4K_KEY}}"
        - Radarr:
            icon: radarr
            href: https://radarr.k8s.hu.ls
            description: Movies
            widget:
              type: radarr
              url: http://radarr.media.svc
              key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
        - Radarr 4K:
            icon: radarr
            href: https://radarr-4k.k8s.hu.ls
            description: Movies (4K)
            widget:
              type: radarr
              url: http://radarr-4k.media.svc
              key: "{{HOMEPAGE_VAR_RADARR4K_KEY}}"

    - Downloads:
        - Transmission:
            icon: transmission
            href: https://transmission.k8s.hu.ls
            description: Torrent Client
            widget:
              type: transmission
              url: http://transmission.media.svc
        - qBittorrent:
            icon: qbittorrent
            href: http://qbittorrent.media.svc
            description: Torrent Client
            widget:
              type: qbittorrent
              url: https://qbittorrent.k8s.hu.ls
        - Prowlarr:
            icon: prowlarr
            href: https://prowlarr.k8s.hu.ls
            description: Indexer Manager
            widget:
              type: prowlarr
              url: http://prowlarr.media.svc
              key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
        - Bazarr:
            icon: bazarr
            href: https://bazarr.k8s.hu.ls
            description: Subtitles
            widget:
              type: bazarr
              url: http://bazarr.media.svc
              key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

    - Network & Admin:
        - UniFi:
            icon: unifi
            href: https://unifi.k8s.hu.ls
            description: Network Controller
        - ArgoCD:
            icon: argo-cd
            href: https://argo.k8s.hu.ls
            description: GitOps Deployments
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "k8s cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

    - openmeteo:
        label: Maastricht
        latitude: 50.8514
        longitude: 5.6910
        timezone: Europe/Amsterdam
        units: metric
        cache: 5

    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short

    - search:
        provider: google
        target: _blank

  bookmarks.yaml: |
    []

  kubernetes.yaml: |
    mode: cluster

  docker.yaml: |
    # not used
