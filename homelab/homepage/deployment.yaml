apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      nodeSelector:
        kubernetes.io/hostname: k3s-nuc
      tolerations:
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: homepage
      # initContainer copies the read-only ConfigMap into a writable emptyDir.
      # This is necessary because:
      #   (a) subPath-mounted ConfigMap files are owned root:root — fsGroup doesn't apply to them.
      #   (b) Homepage writes dynamic files (custom.css, custom.js, cache) into /app/config/
      #       and will silently fall back to defaults if it can't write there.
      initContainers:
        - name: copy-config
          image: busybox:1.38@sha256:fd8d9aa63ba2f0982b5304e1ee8d3b90a210bc1ffb5314d980eb6962f1a9715d
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - sh
            - -c
            - |
              cp /cm/* /app/config/
              # Ensure logs subdir exists so the main container doesn't try to create it
              mkdir -p /app/config/logs
          volumeMounts:
            - name: configmap
              mountPath: /cm
              readOnly: true
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest@sha256:a0b71c8e757298d02560186bab9fbe3fc2d375c523a62cc1019177b37e48aa28
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "home.k8s.hu.ls"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          envFrom:
            - secretRef:
                name: homepage-secrets
                optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        # Read-only ConfigMap source — only used by the initContainer
        - name: configmap
          configMap:
            name: homepage-config
            defaultMode: 0444
        # Writable emptyDir that becomes /app/config in the main container.
        # fsGroup: 1000 applies here, so UID 1000 can read and write freely.
        - name: config
          emptyDir: {}
