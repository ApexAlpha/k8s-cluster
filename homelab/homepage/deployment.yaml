apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: homepage
      # initContainer copies the read-only ConfigMap into a writable emptyDir.
      # This is necessary because:
      #   (a) subPath-mounted ConfigMap files are owned root:root — fsGroup doesn't apply to them.
      #   (b) Homepage writes dynamic files (custom.css, custom.js, cache) into /app/config/
      #       and will silently fall back to defaults if it can't write there.
      initContainers:
        - name: copy-config
          image: busybox:1.37@sha256:b3255e7dfbcd10cb367af0d409747d511aeb66dfac98cf30e97e87e4207dd76f
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - sh
            - -c
            - |
              cp /cm/* /app/config/
              # Ensure logs subdir exists so the main container doesn't try to create it
              mkdir -p /app/config/logs
          volumeMounts:
            - name: configmap
              mountPath: /cm
              readOnly: true
            - name: config
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest@sha256:b129cb0f674bd6d204e215bde2c2fc3f11d6ad0e82f6d20007cf80f74e1acbb1
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "home.k8s.hu.ls"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          envFrom:
            - secretRef:
                name: homepage-secrets
                optional: true
          volumeMounts:
            - name: config
              mountPath: /app/config
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        # Read-only ConfigMap source — only used by the initContainer
        - name: configmap
          configMap:
            name: homepage-config
            defaultMode: 0444
        # Writable emptyDir that becomes /app/config in the main container.
        # fsGroup: 1000 applies here, so UID 1000 can read and write freely.
        - name: config
          emptyDir: {}
