apiVersion: v1
kind: ConfigMap
metadata:
  name: maintenance-page
  namespace: nc-maintenance
data:
  index.html: |-
    <!doctype html>
    <html lang="nl">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Anke &amp; Jules Homelab</title>
      <style>
        :root {
          --bg: #0f1115; --card: #1a1e27; --card2: #232a36;
          --fg: #e6e8ee; --muted: #9aa3b2; --accent: #e8b339;
          --link: #5aa9e6; --border: #2f3748;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          background: radial-gradient(1200px 600px at 50% -10%, #232a36 0%, var(--bg) 60%);
          color: var(--fg); min-height: 100vh;
          display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
          background: var(--card); border: 1px solid var(--border); border-radius: 16px;
          padding: 48px 40px 36px; max-width: 520px; width: 100%;
          text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }
        .logo {
          width: 72px; height: 72px; margin: 0 auto 18px; border-radius: 50%;
          background: linear-gradient(135deg, #2a3242, #1f2530);
          border: 1px solid var(--border);
          display: flex; align-items: center; justify-content: center;
          font-size: 34px;
        }
        h1 { font-size: 23px; font-weight: 700; margin-bottom: 8px; letter-spacing: .2px; }
        .subtitle { color: var(--accent); font-size: 13px; font-weight: 600; text-transform: uppercase;
                    letter-spacing: 1.2px; margin-bottom: 18px; }
        p.body { color: var(--muted); line-height: 1.65; font-size: 15px; }
        .home-link {
          display: inline-block; margin-top: 26px; padding: 12px 26px; border-radius: 10px;
          background: var(--card2); border: 1px solid var(--border); color: var(--link);
          text-decoration: none; font-size: 14.5px; font-weight: 600; transition: all .15s ease;
        }
        .home-link:hover { background: #2a3242; border-color: #3a4356; transform: translateY(-1px); }
        .languages {
          display: flex; gap: 8px; justify-content: center; margin-top: 28px;
          padding-top: 22px; border-top: 1px solid var(--border);
        }
        .lang-btn {
          display: inline-flex; align-items: center; gap: 7px;
          background: transparent; border: 1px solid var(--border); border-radius: 8px;
          color: var(--muted); font-size: 13.5px; font-weight: 600; font-family: inherit;
          padding: 7px 13px; cursor: pointer; transition: all .15s ease;
        }
        .lang-btn:hover { background: var(--card2); color: var(--fg); }
        .lang-btn.active { background: var(--card2); color: var(--fg); border-color: var(--accent); }
        .lang-btn svg { width: 20px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.12); }
        .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
               background: var(--accent); margin-right: 8px; vertical-align: middle;
               animation: blink 1.3s ease-in-out infinite; }
        @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }
        .footer { color: var(--muted); font-size: 12px; margin-top: 24px; opacity: .75; }
      </style>
    </head>
    <body>
      <div class="card">
        <div class="logo">🏠</div>
        <h1><span class="dot"></span><span data-i18n="welcome">Welkom op de website van Anke &amp; Jules</span></h1>
        <div class="subtitle" data-i18n="subtitle">Helaas is deze app niet bekend of niet bereikbaar</div>
    
        <p class="body" data-i18n="body1">Mogelijk heb je een verkeerd adres getypt, of wordt er op dit moment een update geïnstalleerd.</p>
        <p class="body" style="margin-top:10px" data-i18n="body2">Geen zorgen — probeer het over een paar minuten gewoon opnieuw.</p>
    
        <a class="home-link" href="https://home.k8s.hu.ls" data-i18n="homelink">Naar de startpagina</a>
    
        <div class="languages" role="group" aria-label="Language">
          <button class="lang-btn active" data-lang="nl" title="Nederlands">
            <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><rect width="30" height="6.7" fill="#ae1c28"/><rect y="13.3" width="30" height="6.7" fill="#21468b"/></svg>
            NL
          </button>
          <button class="lang-btn" data-lang="en" title="English">
            <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0l30 20M30 0L0 20" stroke="#fff" stroke-width="4"/><path d="M0 0l30 20M30 0L0 20" stroke="#c8102e" stroke-width="2"/><path d="M0 10h30M15 0v20" stroke="#fff" stroke-width="6"/><path d="M0 10h30M15 0v20" stroke="#c8102e" stroke-width="2.4"/></svg>
            EN
          </button>
          <button class="lang-btn" data-lang="fr" title="Français">
            <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#fff"/><rect width="10" height="20" fill="#002395"/><rect x="20" width="10" height="20" fill="#ed2939"/></svg>
            FR
          </button>
          <button class="lang-btn" data-lang="de" title="Deutsch">
            <svg viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#ffce00"/><rect width="30" height="6.7" fill="#000"/><rect y="13.3" width="30" height="6.7" fill="#dd0000"/></svg>
            DE
          </button>
        </div>
    
        <div class="footer">Anke &amp; Jules Homelab · <span data-i18n="footer">Fijn dat je er bent</span> 🙂</div>
      </div>
    
      <script>
        (function () {
          var strings = {
            nl: {
              welcome: 'Welkom op de website van Anke &amp; Jules',
              subtitle: 'Helaas is deze app niet bekend of niet bereikbaar',
              body1: 'Mogelijk heb je een verkeerd adres getypt, of wordt er op dit moment een update geïnstalleerd.',
              body2: 'Geen zorgen — probeer het over een paar minuten gewoon opnieuw.',
              homelink: 'Naar de startpagina',
              footer: 'Fijn dat je er bent'
            },
            en: {
              welcome: 'Welcome to the Anke &amp; Jules website',
              subtitle: 'Unfortunately this app is unknown or unreachable',
              body1: 'You may have mistyped the address, or an update is being installed right now.',
              body2: 'No worries — just give it a few minutes and try again.',
              homelink: 'Go to the home page',
              footer: 'Glad you are here'
            },
            fr: {
              welcome: 'Bienvenue sur le site d&rsquo;Anke &amp; Jules',
              subtitle: 'Malheureusement, cette application est inconnue ou inaccessible',
              body1: 'Vous avez peut-être mal saisi l&rsquo;adresse, ou une mise à jour est en cours d&rsquo;installation.',
              body2: 'Pas de souci — réessayez dans quelques minutes.',
              homelink: 'Aller à la page d&rsquo;accueil',
              footer: 'Ravi de vous voir'
            },
            de: {
              welcome: 'Willkommen auf der Website von Anke &amp; Jules',
              subtitle: 'Leider ist diese App unbekannt oder nicht erreichbar',
              body1: 'Möglicherweise hast du die Adresse falsch eingegeben, oder gerade wird ein Update installiert.',
              body2: 'Kein Problem — versuche es in ein paar Minuten einfach erneut.',
              homelink: 'Zur Startseite',
              footer: 'Schön, dass du da bist'
            }
          };
    
          var saved = null;
          try { saved = localStorage.getItem('aj-homelab-lang'); } catch (e) {}
          var lang = (saved && strings[saved]) ? saved : 'nl';
    
          function apply(l) {
            var s = strings[l];
            if (!s) return;
            document.documentElement.lang = l;
            document.querySelectorAll('[data-i18n]').forEach(function (el) {
              var key = el.getAttribute('data-i18n');
              if (s[key]) el.innerHTML = s[key];
            });
            document.querySelectorAll('.lang-btn').forEach(function (b) {
              b.classList.toggle('active', b.getAttribute('data-lang') === l);
            });
            try { localStorage.setItem('aj-homelab-lang', l); } catch (e) {}
          }
    
          document.querySelectorAll('.lang-btn').forEach(function (b) {
            b.addEventListener('click', function () { apply(b.getAttribute('data-lang')); });
          });
          apply(lang);
        })();
      </script>
    </body>
    </html>
