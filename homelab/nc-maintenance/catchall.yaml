apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: maintenance-catchall
  namespace: nc-maintenance
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Port 80 (web): redirect any unmatched host to HTTPS, consistent with
    # the rest of the cluster.
    - kind: Rule
      match: HostRegexp(`{host:.+}`)
      priority: 1
      middlewares:
        - name: redirect-https
          namespace: kube-system
      services:
        - name: maintenance-page
          port: 80
    # Port 443 (websecure): serve the maintenance page for any unmatched host.
    # Real apps have longer/more specific rules (higher priority) and win.
    - kind: Rule
      match: HostRegexp(`{host:.+}`)
      priority: 1
      services:
        - name: maintenance-page
          port: 80