apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: maintenance-catchall
  namespace: nc-maintenance
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Serve the maintenance page for ANY host no other router claims.
    # Real apps have longer/more specific rules (higher priority) and win.
    # HTTP→HTTPS is handled globally by Traefik's web entrypoint redirect.
    - kind: Rule
      match: HostRegexp(`{host:.+}`)
      priority: 1
      services:
        - name: maintenance-page
          port: 80