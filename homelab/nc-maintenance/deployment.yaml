apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-page
  namespace: nc-maintenance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maintenance-page
  template:
    metadata:
      labels:
        app: maintenance-page
    spec:
      containers:
        - name: page
          image: nginx:alpine@sha256:4a73073bd557c65b759505da037898b61f1be6cbcc3c2c3aeac22d2a470c1752
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits:   {cpu: 100m, memory: 64Mi}
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 5}
      volumes:
        - name: page
          configMap:
            name: maintenance-page
            items:
              - key: index.html
                path: index.html