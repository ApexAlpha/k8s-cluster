apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-page
  namespace: nc-maintenance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maintenance-page
  template:
    metadata:
      labels:
        app: maintenance-page
    spec:
      containers:
        - name: page
          image: nginx:alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits:   {cpu: 100m, memory: 64Mi}
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 5}
      volumes:
        - name: page
          configMap:
            name: maintenance-page
            items:
              - key: index.html
                path: index.html