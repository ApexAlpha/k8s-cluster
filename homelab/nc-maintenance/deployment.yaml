apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintenance-page
  namespace: nc-maintenance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: maintenance-page
  template:
    metadata:
      labels:
        app: maintenance-page
    spec:
      containers:
        - name: page
          image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits:   {cpu: 100m, memory: 64Mi}
          readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 5}
      volumes:
        - name: page
          configMap:
            name: maintenance-page
            items:
              - key: index.html
                path: index.html