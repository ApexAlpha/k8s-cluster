# Headlamp - Modern Kubernetes Dashboard
# https://headlamp.dev/
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: headlamp
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes-sigs.github.io/headlamp/
    chart: headlamp
    targetRevision: 0.41.0
    helm:
      valuesObject:
        replicaCount: 1

        config:
          # Allow plugin installation
          pluginsDir: /headlamp/plugins

        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

        # Ingress handled separately for consistency with other apps
        ingress:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: headlamp
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
