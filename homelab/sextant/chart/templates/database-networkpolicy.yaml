apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-from-sextant
  namespace: database
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - port: 5432
          protocol: TCP
  policyTypes: [Ingress]
