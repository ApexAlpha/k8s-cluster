apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: lea-louke-user
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  cluster:
    name: postgres-shared
  name: lea_louke_user
  login: true
  superuser: false
  createdb: false
  createrole: false
  replication: false
  bypassrls: false
  passwordSecret:
    name: lea-louke-user-password
  databaseRoleReclaimPolicy: retain
