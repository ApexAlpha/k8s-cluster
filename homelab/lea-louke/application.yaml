apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lea-louke
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  project: default
  source:
    repoURL: https://github.com/ApexAlpha/k8s-cluster.git
    targetRevision: main
    path: homelab/lea-louke
  destination:
    server: https://kubernetes.default.svc
    namespace: lea-louke
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: lea-louke
      namespace: lea-louke
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
