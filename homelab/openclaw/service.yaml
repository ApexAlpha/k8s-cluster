apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 18789
---
apiVersion: v1
kind: Endpoints
metadata:
  name: openclaw
  namespace: openclaw
subsets:
  - addresses:
      - ip: 192.168.1.234
    ports:
      - name: http
        port: 18789
