apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.1.0
    helm:
      values: |
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.2@sha256:0751144c1c8e52d52c48717fbd13ad5a3061e612ae4d7ad744a946cd5b139d1a
            volumeMounts:
              - mountPath: /target
                name: plugins

        kubectl:
          image:
            repository: bitnamilegacy/kubectl
            tag: "1.29"

        rbac:
          create: true
          clusterAdministrator: false  # Scoped ClusterRole in scoped-rbac.yaml instead

        credentials:
          useSecret: true
          existingSecret: velero-credentials

        snapshotsEnabled: false

        configuration:
          uploaderType: kopia
          defaultRepoMaintainFrequency: 24h
          defaultVolumesToFsBackup: true
          fsBackupTimeout: 6h
          clientQPS: 100
          clientBurst: 150
          concurrentBackups: 3
          itemBlockWorkerCount: 5
          uploader:
            parallelFilesUpload: 10
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero-backups
              config:
                region: garage
                s3ForcePathStyle: "true"
                s3Url: http://garage-s3.garage.svc.cluster.local:3900
                checksumAlgorithm: ""

        deployNodeAgent: true

        nodeAgent:
          podVolumePath: /var/lib/kubelet/pods
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 2Gi

        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 2Gi

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true

        schedules:
          daily:
            disabled: false
            schedule: "0 1 * * *"
            useOwnerReferencesInBackup: false
            template:
              ttl: "168h0m0s"
              storageLocation: default
              defaultVolumesToFsBackup: true
              excludedNamespaces:
                - kube-system
                - kube-public
                - kube-node-lease
                - velero
                - garage
                - garage

  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m