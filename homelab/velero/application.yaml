apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.0.0
    helm:
      values: |
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.0@sha256:7e82f717f44e89671212e0dfce7e061321c386ea84a33bca64a671670ca6c278
            volumeMounts:
              - mountPath: /target
                name: plugins

        kubectl:
          image:
            repository: bitnamilegacy/kubectl
            tag: "1.29"

        credentials:
          useSecret: true
          existingSecret: velero-credentials

        snapshotsEnabled: false

        configuration:
          uploaderType: kopia
          defaultVolumesToFsBackup: true
          fsBackupTimeout: 6h
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: velero-backups
              config:
                region: garage
                s3ForcePathStyle: "true"
                s3Url: http://garage-s3.garage.svc.cluster.local:3900
                checksumAlgorithm: ""

        deployNodeAgent: true

        nodeAgent:
          # k3s stores pod volumes here, not the standard /var/lib/kubelet/pods
          podVolumePath: /var/lib/kubelet/pods
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi

        metrics:
          enabled: true
          serviceMonitor:
            enabled: true

        schedules:
          nightly:
            disabled: false
            schedule: "0 3 * * *"
            useOwnerReferencesInBackup: false
            template:
              ttl: "168h0m0s"
              storageLocation: default
              defaultVolumesToFsBackup: true
              # Exclude namespaces that don't need backing up
              excludedNamespaces:
                - kube-system
                - kube-public
                - kube-node-lease

  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
