# Scoped ClusterRole for Velero — read-all, write-scoped (NOT cluster-admin)
# Velero must be able to LIST/GET every resource type to produce a complete
# full-cluster backup. Read access is granted cluster-wide; write/delete is
# limited to Velero's own CRDs plus the minimal restore operations below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero-server-scoped
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: velero
    app.kubernetes.io/name: velero
rules:
  # Velero CRDs — full management
  - apiGroups: ["velero.io"]
    resources: ["*"]
    verbs: ["*"]

  # Cluster-wide read — required for complete full-cluster backups.
  # Without this, resources velero cannot list (ingresses, networkpolicies,
  # roles, jobs, cronjobs, HPAs, PDBs, priorityclasses, CRDs, ...) are
  # silently omitted from backups.
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]

  # Restore: create/update in namespaces is handled by velero's own
  # controllers, but the SA needs namespace-scoped write for restore.
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims", "secrets",
                "configmaps", "serviceaccounts", "namespaces", "events"]
    verbs: ["create", "update", "patch", "delete"]

  - apiGroups: ["apps", "batch"]
    resources: ["*"]
    verbs: ["create", "update", "patch", "delete"]

  # Discovery (non-resource URLs)
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/version", "/healthz"]
    verbs: ["get", "list"]
---
# Binding velero-server SA to the scoped ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero-server-scoped
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: velero
    app.kubernetes.io/name: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero-server-scoped
subjects:
  - kind: ServiceAccount
    name: velero-server
    namespace: velero
