# Scoped ClusterRole for Velero — replaces cluster-admin
# Only includes permissions Velero actually needs for backup/restore operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: velero-server-scoped
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: velero
    app.kubernetes.io/name: velero
rules:
  # Velero CRDs — full management
  - apiGroups: ["velero.io"]
    resources: ["*"]
    verbs: ["*"]

  # Core resources for backup/restore operations
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "endpoints",
                "persistentvolumes", "persistentvolumeclaims", "persistentvolumeclaims/status",
                "namespaces", "events", "configmaps", "secrets", "serviceaccounts",
                "limitranges", "replicationcontrollers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Apps resources (Deployments, StatefulSets, DaemonSets, ReplicaSets)
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]

  # Storage resources
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments", "csidrivers", "csinodes"]
    verbs: ["get", "list", "watch"]

  # Discovery (non-resource URLs)
  - nonResourceURLs: ["/api", "/api/*", "/apis", "/apis/*", "/version", "/healthz"]
    verbs: ["get", "list"]

  # Admission webhook configurations (for Velero plugins)
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["get", "list", "watch"]

  # CRD discovery (for backing up custom resources)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # RBAC discovery (needed for Velero to list ClusterRoleBindings during backup)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch"]
---
# Binding velero-server SA to the scoped ClusterRole (replaces cluster-admin binding)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: velero-server-scoped
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: velero
    app.kubernetes.io/name: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: velero-server-scoped
subjects:
  - kind: ServiceAccount
    name: velero-server
    namespace: velero