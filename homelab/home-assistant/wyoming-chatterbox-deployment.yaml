apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-chatterbox
  namespace: home-assistant
  annotations:
    argocd.argoproj.io/sync-wave: "25"
  labels:
    app: wyoming-chatterbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wyoming-chatterbox
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: wyoming-chatterbox
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-nuc
      containers:
        - name: wyoming-openai
          image: ghcr.io/roryeckel/wyoming_openai:latest@sha256:97b0e4c4f994449c5e4a93bfa747f40e04f6f7c925c544cf1a0114b68b057e5d
          ports:
            - containerPort: 10300
          env:
            - name: WYOMING_URI
              value: "tcp://0.0.0.0:10300"
            - name: WYOMING_LOG_LEVEL
              value: "INFO"
            - name: WYOMING_LANGUAGES
              value: "en,nl"
            - name: TTS_OPENAI_URL
              value: "http://192.168.1.240:1234/v1"
            - name: TTS_MODELS
              value: "Chatterbox-Multilingual-MLX-v2-Q8"
            - name: TTS_VOICES
              value: "default"
            - name: TTS_BACKEND
              value: "OPENAI"
            - name: TTS_SPEED
              value: "1.0"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 10300
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 10300
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 2
