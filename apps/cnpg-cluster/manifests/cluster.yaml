apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: main-db
  namespace: databases
spec:
  # 3 instances for async replication across nodes
  instances: 3

  imageName: ghcr.io/cloudnative-pg/postgresql:16

  # Storage on SeaweedFS fast tier
  storage:
    size: 50Gi
    storageClassName: seaweedfs-nvme

  #############################################
  # PostgreSQL tuning for WAN replication
  #############################################
  postgresql:
    parameters:
      # Async replication - don't wait for replicas
      synchronous_commit: "local"

      # Prevent WAL bloat if replica falls behind
      max_slot_wal_keep_size: "5GB"

      # Keep some WAL around for reconnecting replicas
      wal_keep_size: "1GB"

      # Longer timeouts for WAN latency
      wal_sender_timeout: "60s"
      wal_receiver_timeout: "60s"

      # TCP keepalives for WAN connections
      tcp_keepalives_idle: "60"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "6"

      # Checkpoint tuning (less frequent = less WAL traffic)
      checkpoint_timeout: "15min"
      checkpoint_completion_target: "0.9"

      # Memory settings (adjust based on available RAM)
      shared_buffers: "256MB"
      effective_cache_size: "1GB"
      work_mem: "16MB"

  #############################################
  # Failover tuning for unreliable WAN
  #############################################
  failoverDelay: 30
  primaryUpdateStrategy: unsupervised
  switchoverDelay: 60
  startDelay: 300
  stopDelay: 60

  #############################################
  # Spread pods across all 3 nodes
  #############################################
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required

  #############################################
  # Resource limits
  #############################################
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "2"

  #############################################
  # Backup config
  #############################################
  backup:
    barmanObjectStore:
      destinationPath: s3://db-backups/main-db
      endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333
      s3Credentials:
        accessKeyId:
          name: seaweedfs-s3-creds
          key: access-key
        secretAccessKey:
          name: seaweedfs-s3-creds
          key: secret-key
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: "14d"

  #############################################
  # Monitoring
  #############################################
  monitoring:
    enablePodMonitor: true

---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: main-db-daily
  namespace: databases
spec:
  schedule: "0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: main-db
  immediate: true
