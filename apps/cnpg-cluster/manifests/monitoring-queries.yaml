apiVersion: v1
kind: ConfigMap
metadata:
  name: cnpg-custom-queries
  namespace: databases
data:
  queries: |
    # Replication lag - CRITICAL for WAN setup
    pg_replication_lag:
      query: |
        SELECT
          client_addr,
          COALESCE(EXTRACT(EPOCH FROM replay_lag), 0) AS replay_lag_seconds,
          COALESCE(pg_wal_lsn_diff(sent_lsn, replay_lsn), 0) AS replay_lag_bytes
        FROM pg_stat_replication
      primary: true
      metrics:
        - client_addr:
            usage: "LABEL"
            description: "Replica address"
        - replay_lag_seconds:
            usage: "GAUGE"
            description: "Replication lag in seconds"
        - replay_lag_bytes:
            usage: "GAUGE"
            description: "Replication lag in bytes"

    # WAL directory size - watch for bloat
    pg_wal_size:
      query: |
        SELECT sum(size) AS wal_bytes
        FROM pg_ls_waldir()
      primary: true
      metrics:
        - wal_bytes:
            usage: "GAUGE"
            description: "Total WAL directory size in bytes"

    # Replication slots
    pg_replication_slots:
      query: |
        SELECT
          slot_name,
          active::int AS active,
          COALESCE(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn), 0) AS slot_lag_bytes
        FROM pg_replication_slots
      primary: true
      metrics:
        - slot_name:
            usage: "LABEL"
            description: "Slot name"
        - active:
            usage: "GAUGE"
            description: "Slot active (1) or inactive (0)"
        - slot_lag_bytes:
            usage: "GAUGE"
            description: "Slot lag in bytes"

    # Database sizes
    pg_database_size:
      query: |
        SELECT
          datname,
          pg_database_size(datname) AS size_bytes
        FROM pg_database
        WHERE datname NOT IN ('template0', 'template1')
      master: true
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - size_bytes:
            usage: "GAUGE"
            description: "Database size in bytes"
